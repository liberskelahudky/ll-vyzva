<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LL Výzva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0D; --surface:#141419; --surface2:#1C1C24;
  --border:rgba(255,255,255,0.07); --borderStrong:rgba(255,255,255,0.14);
  --text:#F5F5F7; --muted:rgba(245,245,247,0.55); --dim:rgba(245,245,247,0.35);
  --accent:oklch(0.78 0.14 85); --accent2:oklch(0.68 0.20 295);
  --up:oklch(0.75 0.16 150); --down:oklch(0.65 0.20 25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}
::-webkit-scrollbar{width:0;height:0;}
button{font-family:inherit;}

@keyframes toastPop {
  0%  {transform:translateX(-50%) translateY(-12px) scale(0.85);opacity:0;}
  15% {transform:translateX(-50%) translateY(0) scale(1.05);opacity:1;}
  25% {transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
  85% {transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
  100%{transform:translateX(-50%) translateY(-10px) scale(0.95);opacity:0;}
}
@keyframes popIn {
  0%{transform:scale(0.6);opacity:0;}
  70%{transform:scale(1.08);}
  100%{transform:scale(1);opacity:1;}
}
@keyframes slideUp {
  from{transform:translateY(100%);}
  to{transform:translateY(0);}
}
@keyframes barGrow {
  from{height:0;}
  to{height:var(--bar-h);}
}

/* ===== LOGIN ===== */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;background:radial-gradient(ellipse at 50% 0%,color-mix(in oklab,var(--accent) 12%,transparent) 0%,transparent 60%);}
.lg-trophy{font-size:64px;animation:popIn 0.6s cubic-bezier(0.17,0.67,0.35,1.3) both;}
.lg-label{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:600;text-transform:uppercase;font-family:'Space Grotesk',system-ui;margin:14px 0 2px;}
.lg-label-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.lg-title{font-family:'Space Grotesk',system-ui;font-size:32px;font-weight:700;letter-spacing:-0.8px;margin-bottom:4px;}
.lg-sub{color:var(--muted);font-size:13px;margin-bottom:36px;}
.pin-card{background:var(--surface);border:1px solid var(--borderStrong);border-radius:24px;padding:28px 22px;width:100%;max-width:320px;box-shadow:0 32px 80px rgba(0,0,0,0.5);}
.pin-card-lbl{text-align:center;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:22px;}
.pin-dots{display:flex;gap:20px;justify-content:center;margin-bottom:26px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--border);border:2px solid rgba(255,255,255,0.1);transition:all 0.2s;}
.pin-dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.2);box-shadow:0 0 16px color-mix(in oklab,var(--accent) 60%,transparent);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.np{height:60px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Space Grotesk',system-ui;font-size:22px;font-weight:600;cursor:pointer;transition:all 0.12s;}
.np:active{transform:scale(0.92);background:color-mix(in oklab,var(--accent) 12%,var(--surface2));border-color:var(--accent);}
.np.emp{background:transparent;border-color:transparent;pointer-events:none;}
.np.del{font-size:17px;background:rgba(248,81,73,0.08);border-color:rgba(248,81,73,0.15);color:oklch(0.65 0.20 25);}
.pin-err{text-align:center;font-size:13px;color:oklch(0.65 0.20 25);margin-top:14px;min-height:18px;font-weight:600;}

/* ===== APP SHELL ===== */
#storeApp{display:none;min-height:100vh;position:relative;}
.scroll-content{overflow-y:auto;height:100vh;padding-bottom:100px;}

/* ===== STATUS BAR AREA ===== */
.status-bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.sb-time{font-family:'Space Grotesk',system-ui;font-weight:700;font-size:14px;}
.sb-icons{display:flex;gap:4px;align-items:center;font-size:11px;}

/* ===== TOP BAR (DASHBOARD) ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px;}
.topbar-user{display:flex;align-items:center;gap:12px;}
.topbar-greeting{font-size:12px;color:var(--muted);letter-spacing:0.2px;}
.topbar-name{font-size:15px;font-weight:600;letter-spacing:-0.2px;}
.topbar-right{display:flex;gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.streak-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent);font-weight:700;font-size:13px;font-family:'Space Grotesk',system-ui;}

/* ===== HERO CARD ===== */
.hero-card{margin:0 16px;padding:22px;border-radius:28px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in oklab,var(--accent2) 32%,transparent) 0%,transparent 55%),radial-gradient(120% 120% at 0% 100%,color-mix(in oklab,var(--accent) 28%,transparent) 0%,transparent 50%),#13131A;border:1px solid var(--border);position:relative;overflow:hidden;}
.hero-label{font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:600;font-family:'Space Grotesk',system-ui;}
.hero-pts-row{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.hero-pts{font-family:'Space Grotesk',system-ui;font-weight:700;font-size:42px;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;}
.hero-pts-lbl{font-size:14px;color:var(--muted);font-weight:500;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.hero-progress-lbl{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;}
.hero-progress-lbl span:first-child{color:var(--muted);}
.hero-progress-lbl span:last-child{color:var(--text);font-weight:600;font-family:'Space Grotesk',system-ui;font-variant-numeric:tabular-nums;}
.prog-bar-wrap{width:100%;height:7px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;}
.prog-bar-fill{height:100%;border-radius:999px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;}
.mini-stat-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-bottom:4px;font-family:'Space Grotesk',system-ui;}
.mini-stat-val{font-family:'Space Grotesk',system-ui;font-weight:700;font-size:18px;letter-spacing:-0.3px;font-variant-numeric:tabular-nums;}
.mini-stat-sub{font-size:10px;color:var(--dim);margin-top:1px;}

/* ===== SECTION HEADER ===== */
.sec-hdr{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin-bottom:10px;margin-top:22px;}
.sec-hdr-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-family:'Space Grotesk',system-ui;}
.sec-hdr-action{background:none;border:none;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;padding:0;font-family:'Inter',system-ui;}

/* ===== CARDS ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;}
.card-interactive{cursor:pointer;transition:background 0.15s;}
.card-interactive:active{background:var(--surface2);}

/* ===== CHALLENGE CARD ===== */
.ch-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px;cursor:pointer;transition:background 0.15s;position:relative;overflow:hidden;}
.ch-card:active{background:var(--surface2);}
.ch-card.done-card{opacity:0.45;pointer-events:none;}
.ch-cat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ch-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
.ch-title{font-size:16px;font-weight:600;letter-spacing:-0.2px;margin-bottom:2px;}
.ch-metric{font-size:12px;color:var(--muted);}
.ch-badge-hot{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:1.2px;font-weight:700;color:var(--accent);text-transform:uppercase;font-family:'Space Grotesk',system-ui;display:flex;align-items:center;gap:3px;}
.ch-badge-done{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:1.2px;font-weight:700;color:var(--up);text-transform:uppercase;font-family:'Space Grotesk',system-ui;display:flex;align-items:center;gap:3px;}
.ch-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);}
.ch-reward{font-family:'Space Grotesk',system-ui;font-weight:700;color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px;}
.ch-prog-lbl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;}
.ch-prog-lbl span:first-child{color:var(--muted);font-family:'Space Grotesk',system-ui;font-variant-numeric:tabular-nums;}
.ch-filter-bar{display:flex;gap:6px;padding:0 16px 14px;overflow-x:auto;}
.ch-filter-bar::-webkit-scrollbar{display:none;}

/* ===== CHIP ===== */
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;font-family:'Space Grotesk',system-ui;letter-spacing:0.2px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.chip.active{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 18%,transparent);color:var(--accent);}
.chip.active-p{border-color:var(--up);background:color-mix(in oklab,var(--up) 18%,transparent);color:var(--up);}
.chip.active-b{border-color:var(--blue,oklch(0.72 0.15 220));background:color-mix(in oklab,oklch(0.72 0.15 220) 18%,transparent);color:oklch(0.72 0.15 220);}

/* ===== WEEK CHART ===== */
.week-chart{display:flex;align-items:flex-end;justify-content:space-between;height:90px;gap:6px;}
.week-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;}
.week-bar{width:100%;border-radius:6px;background:rgba(255,255,255,0.1);min-height:3px;transition:height 0.6s cubic-bezier(0.4,0,0.2,1);}
.week-bar.today{box-shadow:0 0 14px var(--accent);}
.week-bar-lbl{font-size:10px;color:var(--muted);font-family:'Space Grotesk',system-ui;}

/* ===== ACTIVITY FEED ===== */
.activity-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);}
.activity-row:last-child{border-bottom:none;}
.activity-icon{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.activity-text{flex:1;font-size:14px;letter-spacing:-0.1px;}
.activity-time{font-size:11px;color:var(--dim);margin-top:2px;font-family:'Space Grotesk',system-ui;}
.activity-pts{font-family:'Space Grotesk',system-ui;font-weight:700;color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums;}

/* ===== LEADERBOARD ===== */
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:200px;padding:20px 20px 0;background:radial-gradient(60% 60% at 50% 100%,color-mix(in oklab,var(--accent) 20%,transparent) 0%,transparent 80%);border-radius:24px;margin:0 16px;}
.podium-slot{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
.podium-name{font-size:11px;font-weight:600;color:var(--text);letter-spacing:-0.1px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px;margin-bottom:2px;}
.podium-pts{font-family:'Space Grotesk',system-ui;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:8px;}
.podium-block{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'Space Grotesk',system-ui;font-weight:700;font-size:24px;}
.lb-list{padding:0 16px;display:flex;flex-direction:column;gap:8px;}
.lb-row{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;}
.lb-row.lb-me{border-color:color-mix(in oklab,var(--accent) 40%,transparent);background:color-mix(in oklab,var(--accent) 6%,var(--surface));}
.lb-rank-num{width:28px;text-align:center;font-family:'Space Grotesk',system-ui;font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;}
.lb-rank-num.me{color:var(--accent);}
.lb-name-col{flex:1;min-width:0;}
.lb-store-name{font-size:14px;font-weight:600;letter-spacing:-0.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-store-meta{font-size:11px;color:var(--dim);margin-top:1px;}
.lb-pts-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.lb-eff{font-family:'Space Grotesk',system-ui;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
.lb-raw{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}

/* ===== TREND PILL ===== */
.trend-pill{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:600;font-family:'Space Grotesk',system-ui;font-variant-numeric:tabular-nums;}

/* ===== LEAGUE BADGE ===== */
.league-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;font-family:'Space Grotesk',system-ui;}
.league-dot{border-radius:50%;box-shadow:0 0 6px currentColor;}

/* ===== AVATAR ===== */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:0.5px;font-family:'Space Grotesk',system-ui;flex-shrink:0;color:#0A0A0D;}

/* ===== REWARDS ===== */
.reward-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:10px;}
.reward-card.unavailable{opacity:0.5;}
.reward-tier{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-family:'Space Grotesk',system-ui;margin-bottom:10px;}
.reward-title{font-size:16px;font-weight:600;letter-spacing:-0.2px;margin-bottom:6px;}
.reward-inventory{font-size:12px;color:var(--muted);}
.reward-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.reward-cost{font-family:'Space Grotesk',system-ui;font-weight:700;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums;}
.reward-btn{padding:9px 18px;border-radius:12px;border:none;font-family:'Inter',system-ui;font-size:13px;font-weight:700;cursor:pointer;}
.reward-btn.avail{background:var(--accent);color:#0A0A0D;}
.reward-btn.unavail{background:rgba(255,255,255,0.08);color:var(--muted);pointer-events:none;}

/* ===== BOTTOM TAB BAR ===== */
.tab-bar-outer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 16px 28px;background:linear-gradient(180deg,transparent 0%,var(--bg) 30%);pointer-events:none;z-index:100;}
.tab-bar{display:flex;justify-content:space-around;background:rgba(20,20,25,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:24px;padding:8px 4px;pointer-events:auto;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-family:'Inter',system-ui;transition:color 0.15s;}
.tab-btn.on{color:var(--accent);}
.tab-btn-lbl{font-size:10px;font-weight:600;letter-spacing:0.2px;}

/* ===== LOG BUTTON ===== */
.log-btn{width:100%;padding:16px;background:var(--accent);color:#0A0A0D;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',system-ui;letter-spacing:-0.2px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 28px color-mix(in oklab,var(--accent) 40%,transparent);}

/* ===== BOTTOM SHEET ===== */
.sheet-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity 0.25s;}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;z-index:201;background:var(--bg);border-top:1px solid var(--border);border-radius:24px 24px 0 0;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);max-height:85vh;overflow:hidden;}
.sheet-panel.open{transform:translateX(-50%) translateY(0);}
.sheet-handle{display:flex;justify-content:center;padding:10px 0 4px;}
.sheet-handle-bar{width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:999px;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 12px;}
.sheet-title{font-size:18px;font-weight:700;font-family:'Space Grotesk',system-ui;letter-spacing:-0.3px;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--surface);border:none;color:var(--text);font-size:16px;cursor:pointer;}
.sheet-body{max-height:70vh;overflow-y:auto;padding:4px 0 24px;}

/* ===== LOG ACTIONS ===== */
.log-action-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;text-align:left;font-family:'Inter',system-ui;width:100%;transition:background 0.12s;}
.log-action-btn:active{background:var(--surface2);}
.log-action-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.log-action-pts{font-family:'Space Grotesk',system-ui;font-weight:700;color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums;}

/* ===== TOAST ===== */
.pts-toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:300;padding:12px 22px;border-radius:999px;background:var(--accent);color:#0A0A0D;font-family:'Space Grotesk',system-ui;font-weight:700;font-size:18px;letter-spacing:-0.3px;box-shadow:0 10px 40px color-mix(in oklab,var(--accent) 50%,transparent);animation:toastPop 1.8s ease-out forwards;display:flex;align-items:center;gap:8px;pointer-events:none;}

/* ===== ADMIN ===== */
#adminApp{display:none;min-height:100vh;}
.adm-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;}
.adm-title{font-family:'Space Grotesk',system-ui;font-size:17px;font-weight:700;flex:1;color:var(--accent);}
.adm-sub{font-size:11px;color:var(--muted);}
.adm-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-family:'Inter',system-ui;font-size:12px;font-weight:700;}
.adm-content{padding:14px 14px 90px;}
.adm-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.adm-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;cursor:pointer;background:none;border:none;color:var(--muted);font-family:'Inter',system-ui;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;transition:color 0.15s;}
.adm-nav-btn.on{color:var(--accent);}
.adm-nav-ico{font-size:18px;}

/* ===== ADMIN CARDS ===== */
.adm-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.adm-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.adm-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
.adm-stat-num{font-family:'Space Grotesk',system-ui;font-size:32px;font-weight:700;color:var(--accent);}

/* ===== FORMS ===== */
.frow{margin-bottom:13px;}
.flabel{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px;}
.finput,.fsel,.ftarea{width:100%;padding:11px 13px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Inter',system-ui;font-size:14px;outline:none;transition:border-color 0.2s;}
.finput:focus,.fsel:focus,.ftarea:focus{border-color:var(--accent);}
.fsel option{background:var(--surface2);}
.ftarea{resize:vertical;min-height:76px;line-height:1.5;}

.btn-add-sm{background:color-mix(in oklab,var(--up) 12%,transparent);color:var(--up);border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;}

.correct-opts{display:flex;gap:6px;}
.copt{padding:7px 13px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Inter',system-ui;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;}

// ====================== HELPERS ======================
function getLeagueIdx(pts){var idx=0;for(var i=0;i<LEAGUES.length;i++){if(pts>=LEAGUES[i].min)idx=i;}return idx;}
function getLeague(pts){return LEAGUES[getLeagueIdx(pts)];}
function getNextLeague(pts){var idx=getLeagueIdx(pts);return idx<LEAGUES.length-1?LEAGUES[idx+1]:null;}
function getLeagueProgress(pts){var cur=getLeague(pts);var next=getNextLeague(pts);if(!next)return 1;return(pts-cur.min)/(next.min-cur.min);}
function getStore(id){for(var i=0;i<DATA.stores.length;i++)if(DATA.stores[i].id===id)return DATA.stores[i];return null;}
function getUser(id){if(!id)return null;for(var i=0;i<DATA.users.length;i++)if(DATA.users[i].id===id)return DATA.users[i];return null;}
function getUserByEmail(email){var e=email.toLowerCase().trim();for(var i=0;i<DATA.users.length;i++)if(DATA.users[i].email.toLowerCase()===e)return DATA.users[i];return null;}
function getCh(id){for(var i=0;i<DATA.challenges.length;i++)if(DATA.challenges[i].id===id)return DATA.challenges[i];return null;}
function getUserPoints(uid){
  var p=0;
  for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.userId===uid&&(c.scope==='personal'||c.scope==='both'||!c.scope))p+=c.points;}
  return Math.max(0,p);
}
function getStoreRawPoints(sid){
  var p=0;
  for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.storeId===sid&&(c.scope==='store'||c.scope==='both'||!c.scope))p+=c.points;}
  return p;
}
function getStoreEffPts(sid){var s=getStore(sid);var raw=getStoreRawPoints(sid);return Math.max(0,Math.round(raw*(s?s.hcp:1.0)));}
function isCompleteStore(sid,chid){for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.storeId===sid&&c.challengeId===chid)return true;}return false;}
function getProgress(sid,chid){for(var i=0;i<DATA.progress.length;i++){var p=DATA.progress[i];if(p.storeId===sid&&p.challengeId===chid)return p.current;}return 0;}
function setProgress(sid,chid,val){for(var i=0;i<DATA.progress.length;i++){if(DATA.progress[i].storeId===sid&&DATA.progress[i].challengeId===chid){DATA.progress[i].current=val;return;}}DATA.progress.push({storeId:sid,challengeId:chid,current:val});}
function getRankedStores(){var arr=[];for(var i=0;i<DATA.stores.length;i++){var s=DATA.stores[i];arr.push({id:s.id,name:s.name,category:s.category,hcp:s.hcp,rawPts:getStoreRawPoints(s.id),effPts:getStoreEffPts(s.id)});}arr.sort(function(a,b){return b.effPts-a.effPts;});return arr;}
function getRankedUsers(){var arr=[];for(var i=0;i<DATA.users.length;i++){var u=DATA.users[i];if(!u.active)continue;arr.push({id:u.id,name:u.name,email:u.email,role:u.role,storeId:u.storeId,pts:getUserPoints(u.id)});}arr.sort(function(a,b){return b.pts-a.pts;});return arr;}
function getStoreRank(sid){var r=getRankedStores();for(var i=0;i<r.length;i++){if(r[i].id===sid)return i+1;}return r.length;}
function getTodayPts(uid,sid){var d=today();var p=0;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.date===d&&(c.userId===uid||c.storeId===sid))p+=Math.max(0,c.points);}return p;}
function getStreak(sid){var streak=0;var now=new Date();for(var i=0;i<30;i++){var d=new Date(now);d.setDate(now.getDate()-i);var ds=d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();var found=false;for(var j=0;j<DATA.completions.length;j++){if(DATA.completions[j].storeId===sid&&DATA.completions[j].date===ds){found=true;break;}}if(found)streak++;else break;}return streak;}
function getWeekChart(sid){var now=new Date();var dow=now.getDay();var monday=new Date(now);monday.setDate(now.getDate()-(dow===0?6:dow-1));monday.setHours(0,0,0,0);var labels=['Po','Ut','St','Ct','Pa','So','Ne'];var result=[];for(var i=0;i<7;i++){var day=new Date(monday);day.setDate(monday.getDate()+i);var ds=day.getDate()+'.'+(day.getMonth()+1)+'.'+day.getFullYear();var pts=0;for(var j=0;j<DATA.completions.length;j++){var c=DATA.completions[j];if(c.storeId===sid&&c.date===ds&&c.points>0)pts+=c.points;}result.push({d:labels[i],v:pts,isToday:(i===(dow===0?6:dow-1))});}return result;}
function today(){var d=new Date();return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();}
function fmtNum(n){return Math.round(n).toLocaleString('cs-CZ').replace(/,/g,' ');}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){var r='';for(var i=0;i<s.length;i++){r+=s[i]==='\n'?'<br>':s[i];}return r;}
function showMsg(id,txt,col){var el=document.getElementById(id);if(!el)return;el.textContent=txt;el.style.color=col||'var(--up)';}
function showEl(id){var el=document.getElementById(id);if(el)el.style.display='';}
function hideEl(id){var el=document.getElementById(id);if(el)el.style.display='none';}
var storeColors=['oklch(0.72 0.16 70)','oklch(0.70 0.16 300)','oklch(0.72 0.15 160)','oklch(0.68 0.18 25)','oklch(0.75 0.12 220)','oklch(0.70 0.14 340)','oklch(0.72 0.14 100)','oklch(0.66 0.16 40)'];
function storeColor(idx){return storeColors[idx%storeColors.length];}
function storeInitials(name){var parts=name.split(/[\s\-]+/);if(parts.length>=2)return(parts[0][0]+(parts[1][0]||'')).toUpperCase();return name.substring(0,2).toUpperCase();}
function avatarHtml(initials,color,size){size=size||40;return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+color+';display:flex;align-items:center;justify-content:center;font-weight:600;font-size:'+(size*0.36)+'px;color:#0A0A0D;flex-shrink:0;font-family:Space Grotesk,system-ui;">'+esc(initials)+'</div>';}
function leagueBadgeHtml(name,size){var league=LEAGUES[0];for(var i=0;i<LEAGUES.length;i++)if(LEAGUES[i].name===name)league=LEAGUES[i];var pad=size==='lg'?'5px 12px':'3px 8px';var fs=size==='lg'?'11px':'10px';var ds=size==='lg'?7:5;return '<span style="display:inline-flex;align-items:center;gap:5px;padding:'+pad+';border-radius:999px;background:color-mix(in oklab,'+league.color+' 14%,transparent);border:0.5px solid color-mix(in oklab,'+league.color+' 35%,transparent);color:'+league.color+';font-size:'+fs+';font-weight:600;font-family:Space Grotesk,system-ui;"><span style="width:'+ds+'px;height:'+ds+'px;border-radius:50%;background:'+league.color+';box-shadow:0 0 6px '+league.color+';display:inline-block;"></span>'+esc(name)+'</span>';}
function progressBarHtml(v,max,color,h){var pct=max>0?Math.min(100,(v/max)*100):0;h=h||6;color=color||'var(--accent)';return '<div style="height:'+h+'px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;border-radius:999px;background:'+color+';box-shadow:0 0 12px '+color+';transition:width 0.6s;"></div></div>';}

    var xhr=new XMLHttpRequest();xhr.open('GET','https://api.github.com/gists/'+GH.gistId);
    xhr.setRequestHeader('Authorization','token '+GH.token);
    xhr.onload=function(){if(xhr.status===200){try{var d=JSON.parse(xhr.responseText);var f=d.files[GIST_FILE];if(f&&f.content){DATA=JSON.parse(f.content);localStorage.setItem(DATA_KEY,f.content);}}catch(e){loadLocal();}}else loadLocal();if(cb)cb();};
    xhr.onerror=function(){loadLocal();if(cb)cb();};xhr.send();
  }else{loadLocal();if(cb)cb();}
}
function loadLocal(){var s=localStorage.getItem(DATA_KEY);if(s){try{DATA=JSON.parse(s);}catch(e){}}}
function saveData(cb){
  var json=JSON.stringify(DATA,null,2);localStorage.setItem(DATA_KEY,json);
  var sc=parseInt(localStorage.getItem('ll_v4_sc')||'0')+1;localStorage.setItem('ll_v4_sc',sc);if(sc%10===0)createSnapshot(true);
  syncToSheets();
  if(!GH.token||!GH.gistId){if(cb)cb(true,false);return;}
  var files={};files[GIST_FILE]={content:json};
  var xhr=new XMLHttpRequest();xhr.open('PATCH','https://api.github.com/gists/'+GH.gistId);
  xhr.setRequestHeader('Authorization','token '+GH.token);xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){if(cb)cb(xhr.status===200,true);};xhr.onerror=function(){if(cb)cb(false,true);};
  xhr.send(JSON.stringify({files:files}));
}
function syncToSheets(){
  var url=DATA.sheetsUrl||localStorage.getItem('ll_v4_sheets')||'';if(!url)return;
  var rows=[];
  for(var i=0;i<DATA.users.length;i++){
    var u=DATA.users[i];if(!u.active)continue;
    var userPts=getUserPoints(u.id);var s=getStore(u.storeId);var storePts=getStoreEffPts(u.storeId);
    var pen=0;for(var j=0;j<DATA.completions.length;j++){var c=DATA.completions[j];if(c.userId===u.id&&c.points<0)pen+=c.points;}
    var lastAct='';for(var k=DATA.completions.length-1;k>=0;k--){if(DATA.completions[k].userId===u.id){lastAct=DATA.completions[k].date;break;}}
    rows.push({jmeno:u.name,email:u.email,role:u.role==='provozni'?'Provozní':'Prodavačka',prodejna:s?s.name:'',body_osobni:userPts,body_prodejna:storePts,sankce:pen,celkem:userPts+storePts,liga:getLeague(userPts).name,posledni_aktivita:lastAct,sezona:DATA.season.title});
  }
  // Use no-cors mode - Apps Script doesn't support CORS preflight
  try{
    fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify({rows:rows,updated:today()})});
  }catch(e){}
}

function submitEmail(){
  var email=document.getElementById('emailInput').value.trim();
  if(email.toLowerCase()==='admin'||email.toLowerCase()==='admin@ll.cz'){LOGIN_USER={name:'Admin',role:'admin',email:'admin'};goToPin();return;}

function goToPin(){
  document.getElementById('emailStep').style.display='none';
  document.getElementById('pinStep').style.display='block';
  document.getElementById('loginUserName').textContent=LOGIN_USER.name;
  var rl=LOGIN_USER.role==='provozni'?'Provozní':LOGIN_USER.role==='admin'?'Administrator':'Prodavačka';

function npDel(){PIN_BUF=PIN_BUF.slice(0,-1);updatePinDots();document.getElementById('pinErr').textContent='';}
function updatePinDots(){for(var i=0;i<4;i++){var el=document.getElementById('pd'+i);if(el){if(i<PIN_BUF.length)el.classList.add('on');else el.classList.remove('on');}}}
function checkPin(){
  var adminPin=localStorage.getItem(ADMIN_PIN_KEY)||'0000';
  if(LOGIN_USER&&LOGIN_USER.role==='admin'){
    if(PIN_BUF===adminPin){SESSION={userId:null,storeId:null,isAdmin:true,role:'admin',userName:'Admin',userEmail:'admin'};localStorage.setItem(SESSION_KEY,JSON.stringify(SESSION));openAdmin();}
    else{document.getElementById('pinErr').textContent='Nesprávný PIN';PIN_BUF='';updatePinDots();}return;
  }
  if(LOGIN_USER&&PIN_BUF===LOGIN_USER.pin){
    SESSION={userId:LOGIN_USER.id,storeId:LOGIN_USER.storeId,isAdmin:false,role:LOGIN_USER.role,userName:LOGIN_USER.name,userEmail:LOGIN_USER.email};
    localStorage.setItem(SESSION_KEY,JSON.stringify(SESSION));openStore();
  }else{document.getElementById('pinErr').textContent='Nesprávný PIN';PIN_BUF='';updatePinDots();}
}

function renderRewardsTab(){

      if(pr.imageUrl){html+='<div style="position:relative;height:140px;overflow:hidden;"><img src="'+esc(pr.imageUrl)+'" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'"><div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(10,10,13,0.9) 100%);"></div><div style="position:absolute;bottom:12px;left:14px;right:14px;display:flex;align-items:flex-end;justify-content:space-between;"><div style="font-size:16px;font-weight:700;color:white;font-family:Space Grotesk,system-ui;">'+esc(pr.title)+'</div><div style="background:rgba(0,0,0,0.5);border:1px solid color-mix(in oklab,var(--accent) 50%,transparent);padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;color:var(--accent);">'+fmtNum(pr.points)+' b</div></div></div><div style="padding:12px 14px 14px;">';}
      else{html+='<div style="padding:16px 14px 0;display:flex;align-items:center;gap:12px;"><div style="width:46px;height:46px;border-radius:14px;flex-shrink:0;background:color-mix(in oklab,var(--accent) 14%,transparent);border:1px solid color-mix(in oklab,var(--accent) 25%,transparent);display:flex;align-items:center;justify-content:center;font-size:24px;">'+esc(pr.emoji)+'</div><div style="flex:1;"><div style="font-size:16px;font-weight:700;">'+esc(pr.title)+'</div><div style="font-size:12px;color:var(--muted);">'+esc(pr.inventory||'Dostupne')+'</div></div><div style="font-family:Space Grotesk,system-ui;font-weight:700;color:var(--accent);">'+fmtNum(pr.points)+'</div></div><div style="padding:10px 14px 14px;">';}
      html+='<div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px;">'+esc(pr.description)+'</div>';
      html+='<div style="height:5px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;margin-bottom:6px;"><div style="width:'+pct+'%;height:100%;border-radius:999px;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width 0.6s;"></div></div>';

function openRewardDetail(pid){

  body+='<div style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 18px;">'+fmtNum(Math.min(pts,pr.points))+' / '+fmtNum(pr.points)+' bodu ('+pct+' %)</div>';

  openModal(esc(pr.title),body);

function startQuiz(chid){var ch=getCh(chid);if(!ch)return;QUIZ.id=chid;QUIZ.qIdx=0;QUIZ.score=0;QUIZ.answered=false;renderQuestion();}
function renderQuestion(){
  var ch=getCh(QUIZ.id);var q=ch.questions[QUIZ.qIdx];var total=ch.questions.length;var letters=['A','B','C','D'];
  var html='<div style="min-height:100vh;background:var(--bg);padding:20px 16px 40px;">';
  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;"><button onclick="closeQuiz()" style="width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:18px;cursor:pointer;">\u2715</button>';
  html+='<div style="flex:1;font-size:13px;color:var(--muted);font-weight:600;">'+esc(ch.title)+'</div><div style="font-family:Space Grotesk,system-ui;font-weight:700;color:var(--accent);">+'+QUIZ.score+'</div></div>';
  html+='<div style="height:5px;background:rgba(255,255,255,0.06);border-radius:3px;margin-bottom:24px;overflow:hidden;"><div style="width:'+(QUIZ.qIdx/total*100)+'%;height:100%;background:var(--accent);border-radius:3px;box-shadow:0 0 12px var(--accent);"></div></div>';
  html+='<div style="font-size:12px;color:var(--muted);font-weight:800;text-align:center;margin-bottom:8px;">Otazka '+(QUIZ.qIdx+1)+' z '+total+'</div>';
  html+='<div style="font-size:19px;font-weight:700;text-align:center;margin-bottom:30px;line-height:1.4;">'+esc(q.q)+'</div>';
  for(var i=0;i<q.opts.length;i++){html+='<button id="a'+i+'" onclick="answerQ('+i+')" style="width:100%;padding:16px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-family:Inter,system-ui;font-size:15px;font-weight:600;text-align:left;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:12px;"><div style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">'+letters[i]+'</div>'+esc(q.opts[i])+'</button>';}
  html+='</div>';
  document.getElementById('storeContent').innerHTML=html;document.getElementById('scrollContent').scrollTop=0;QUIZ.answered=false;
}
function answerQ(idx){
  if(QUIZ.answered)return;QUIZ.answered=true;var ch=getCh(QUIZ.id);var q=ch.questions[QUIZ.qIdx];
  document.querySelectorAll('[id^="a"]').forEach(function(b){b.disabled=true;});
  if(idx===q.correct){document.getElementById('a'+idx).style.cssText+='border-color:var(--up);background:color-mix(in oklab,var(--up) 10%,transparent);color:var(--up);';QUIZ.score+=ch.pointsEach;}
  else{document.getElementById('a'+idx).style.cssText+='border-color:var(--down);color:var(--down);';if(document.getElementById('a'+q.correct))document.getElementById('a'+q.correct).style.cssText+='border-color:var(--up);color:var(--up);';}
  setTimeout(function(){QUIZ.qIdx++;if(QUIZ.qIdx<ch.questions.length)renderQuestion();else finishQuiz();},900);
}
function finishQuiz(){

  var html='<div style="min-height:100vh;background:var(--bg);padding:60px 24px;text-align:center;"><div style="font-size:80px;">'+emoji+'</div>';
  html+='<div style="font-family:Space Grotesk,system-ui;font-size:32px;font-weight:700;color:var(--accent);margin:18px 0 8px;">'+(pct===1?'Perfektní!':pct>=0.6?'Skvělá práce!':'Příště lépe!')+'</div>';
  html+='<div style="font-family:Space Grotesk,system-ui;font-size:64px;font-weight:700;color:var(--up);line-height:1;">+'+QUIZ.score+'</div>';
  html+='<div style="font-size:14px;color:var(--muted);margin:8px 0 36px;">bodu z '+max+' moznych - '+Math.round(pct*100)+' %</div>';
  html+='<button onclick="closeQuizResult()" style="display:block;width:100%;padding:16px;background:var(--up);color:white;border:none;border-radius:14px;font-family:Inter,system-ui;font-size:16px;font-weight:700;cursor:pointer;max-width:300px;margin:0 auto;">Zpet na prehled</button></div>';
  if(QUIZ.score>0){DATA.completions.push({storeId:SESSION.storeId,userId:SESSION.userId,challengeId:QUIZ.id,title:ch.title,category:ch.category,points:QUIZ.score,scope:'personal',date:today()});saveData(null);}

}

function saveUser(uid){
  var name=document.getElementById('uName').value.trim();var email=document.getElementById('uEmail').value.trim().toLowerCase();
  var pin=document.getElementById('uPin').value.trim();var role=document.getElementById('uRole').value;var storeId=document.getElementById('uStore').value;
  if(!name||!email||pin.length!==4){showMsg('uMsg','Vyplňte jméno, email a 4místný PIN','oklch(0.65 0.20 25)');return;}
  var exists=false;for(var i=0;i<DATA.users.length;i++){if(DATA.users[i].email.toLowerCase()===email&&DATA.users[i].id!==uid){exists=true;break;}}
  if(exists){showMsg('uMsg','Tento email již existuje','oklch(0.65 0.20 25)');return;}
  if(uid){for(var j=0;j<DATA.users.length;j++){if(DATA.users[j].id===uid){DATA.users[j].name=name;DATA.users[j].email=email;DATA.users[j].pin=pin;DATA.users[j].role=role;DATA.users[j].storeId=storeId;break;}}}
  else DATA.users.push({id:'u_'+Date.now(),name:name,email:email,pin:pin,role:role,storeId:storeId,active:true});
  saveData(function(){closeModal();renderAdminUsers();syncToSheets();});
}

function renderAdminSettings(){
  var adminPin=localStorage.getItem(ADMIN_PIN_KEY)||'0000';var snapshots=getSnapshots();var lastSave=localStorage.getItem('ll_v4_last_save')||'---';
  var html='<div class="adm-card"><div class="adm-sec-title">Sezona</div><div class="frow"><label class="flabel">Nazev sezony</label><input class="finput" id="sTitle" value="'+esc(DATA.season.title)+'"></div><button class="btn-p" onclick="saveSeason()" style="margin-bottom:8px;">Ulozit</button><button class="btn-s" onclick="confirmReset()">Reset bodu (nova sezona)</button><div class="msg" id="seasonMsg"></div></div>';
  html+='<div class="adm-card"><div class="adm-sec-title">Admin PIN (aktualni: '+adminPin+')</div><div class="frow"><input class="finput" id="sAdminPin" type="number" placeholder="Novy 4mistny PIN"></div><button class="btn-p" onclick="saveAdminPin()">Zmenit PIN</button><div class="msg" id="pinMsg"></div></div>';
  html+='<div class="adm-card"><div class="adm-sec-title">Google Sheets sync</div>';
  html+='<div class="frow"><label class="flabel">Apps Script Web App URL</label><input class="finput" id="sSheetsUrl" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(DATA.sheetsUrl||localStorage.getItem('ll_v4_sheets')||'')+'"></div>';
  html+='<button class="btn-p" onclick="saveSheetsUrl()" style="margin-bottom:8px;">Ulozit a testovat</button><button class="btn-s" onclick="syncToSheets();showMsg(\'sheetsMsg\',\'Sync odeslan\',\'var(--up)\')">Synchronizovat ted</button>';
  html+='<div class="msg" id="sheetsMsg"></div>';
  html+='<div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6;">\uD83D\uDCCB Jak nastavit:<br>1. Otevri Google Sheets<br>2. Rozsireni - Apps Script<br>3. Vloz Apps Script kod (tlacitko nize)<br>4. Nasadit jako webovou aplikaci<br>5. URL vloz sem</div>';
  html+='<button onclick="showSheetsScript()" style="margin-top:10px;width:100%;padding:10px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;">Zobrazit Apps Script kod</button></div>';
  html+='<div class="adm-card"><div class="adm-sec-title">GitHub Gist</div><div class="frow"><label class="flabel">Token</label><input class="finput" id="sToken" type="password" value="'+esc(GH.token)+'"></div><div class="frow"><label class="flabel">Gist ID</label><input class="finput" id="sGist" value="'+esc(GH.gistId)+'"></div><button class="btn-p" onclick="saveGH()">Ulozit</button><div class="msg" id="ghMsg"></div></div>';
  html+='<div class="adm-card"><div class="adm-sec-title">Zaloha dat</div>';
  html+='<div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Posledni zaloha: <strong>'+esc(lastSave)+'</strong> - Celkem zaloh: <strong>'+snapshots.length+'</strong></div>';
  html+='<div style="display:flex;gap:8px;margin-bottom:10px;"><button class="btn-p" style="flex:1;" onclick="createSnapshot()">Zaloha ted</button><button class="btn-s" style="flex:1;margin:0;" onclick="exportJSON()">Stahnout JSON</button></div>';
  html+='<div class="frow"><label class="flabel">Import JSON zalohy</label><div style="display:flex;gap:8px;"><label style="flex:1;padding:11px 13px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);text-align:center;">Soubor <input type="file" accept=".json" style="display:none;" onchange="loadJSONFile(this)"></label><button class="btn-p" style="flex:1;" onclick="importJSON()">Importovat</button></div></div>';
  html+='<div class="msg" id="backupMsg"></div>';
  if(snapshots.length>0){html+='<div style="margin-top:12px;">';for(var si=snapshots.length-1;si>=Math.max(0,snapshots.length-6);si--){var snap=snapshots[si];html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);"><div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:700;">'+esc(snap.label)+'</div><div style="font-size:11px;color:var(--muted);">'+(snap.users||0)+' uzivatelu - '+(snap.completions||0)+' akci</div></div><button onclick="restoreSnapshot('+si+')" style="background:color-mix(in oklab,var(--accent) 12%,transparent);color:var(--accent);border:none;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;">Obnovit</button></div>';}html+='</div>';}
  html+='</div>';
  document.getElementById('adminContent').innerHTML=html;
}
function saveSeason(){DATA.season.title=document.getElementById('sTitle').value.trim();saveData(function(ok){showMsg('seasonMsg',ok?'Uloženo':'Lokalne');});}
function confirmReset(){openModal('Reset sezony?','<p style="color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.6;">Smazou se vsechny body. Nevratna akce.</p><button class="btn-p" style="background:oklch(0.65 0.20 25);" onclick="doReset()">Ano, resetovat</button><button class="btn-s" onclick="closeModal()">Zrusit</button>');}
function doReset(){DATA.completions=[];DATA.progress=[];saveData(null);closeModal();renderAdminOverview();}
function saveAdminPin(){var v=document.getElementById('sAdminPin').value.trim();if(v.length!==4||isNaN(v)){showMsg('pinMsg','4 cislice','oklch(0.65 0.20 25)');return;}localStorage.setItem(ADMIN_PIN_KEY,v);document.getElementById('sAdminPin').value='';showMsg('pinMsg','PIN změněn');}
function saveGH(){GH.token=document.getElementById('sToken').value.trim();GH.gistId=document.getElementById('sGist').value.trim();localStorage.setItem(GH_TOKEN_KEY,GH.token);localStorage.setItem(GH_GIST_KEY,GH.gistId);showMsg('ghMsg','Uloženo');}
function saveSheetsUrl(){var url=document.getElementById('sSheetsUrl').value.trim();DATA.sheetsUrl=url;localStorage.setItem('ll_v4_sheets',url);saveData(null);syncToSheets();showMsg('sheetsMsg','Ulozeno, sync odeslan','var(--up)');}
function showSheetsScript(){
  var code='// LL Vyzva v4 - Apps Script\n// 1. Otevri Google Sheets\n// 2. Rozsireni > Apps Script\n// 3. Vloz tento kod\n// 4. Nasadit > Jako webovou aplikaci (pristup: vsichni)\n// 5. URL vloz do Nastaveni v appce\n\nfunction doPost(e) {\n  try {\n    var data = JSON.parse(e.postData.contents);\n    var rows = data.rows || [];\n    \n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sheet = ss.getSheetByName("LL-Prehled") || ss.insertSheet("LL-Prehled");\n    \n    sheet.clearContents();\n    \n    // Hlavicka\n    var header = ["Jmeno","Email","Role","Prodejna","Osobní body","Body prodejny","Sankce","Celkem","Liga","Poslední aktivita","Sezóna","Aktualizovano"];\n    sheet.appendRow(header);\n    \n    // Data\n    for (var i = 0; i < rows.length; i++) {\n      var r = rows[i];\n      sheet.appendRow([r.jmeno,r.email,r.role,r.prodejna,r.body_osobni,r.body_prodejna,r.sankce,r.celkem,r.liga,r.posledni_aktivita,r.sezona,data.updated]);\n    }\n    \n    // Format\n    sheet.setFrozenRows(1);\n    var headerRange = sheet.getRange(1, 1, 1, 12);\n    headerRange.setFontWeight("bold");\n    headerRange.setBackground("#1a1a2e");\n    headerRange.setFontColor("#ffffff");\n    sheet.autoResizeColumns(1, 12);\n    \n    return ContentService\n      .createTextOutput(JSON.stringify({status:"ok",rows:rows.length}))\n      .setMimeType(ContentService.MimeType.JSON);\n  } catch(err) {\n    return ContentService\n      .createTextOutput(JSON.stringify({status:"error",message:err.toString()}))\n      .setMimeType(ContentService.MimeType.JSON);\n  }\n}\n\nfunction doGet(e) {\n  return ContentService\n    .createTextOutput(JSON.stringify({status:"LL Vyzva v4 API ready"}))\n    .setMimeType(ContentService.MimeType.JSON);\n}';
  openModal('Apps Script kód','<div style="font-size:11px;color:var(--muted);margin-bottom:12px;">Zkopiruj a vloz do Apps Script. Pak nasad jako webovou aplikaci.</div><textarea style="width:100%;height:280px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-family:monospace;font-size:11px;line-height:1.5;resize:vertical;">'+esc(code)+'</textarea><button class="btn-p" style="margin-top:10px;" onclick="try{navigator.clipboard.writeText(document.querySelector(\'textarea\').value);}catch(e){}showMsg(\'csMsg\',\'Zkopirovan\',\'var(--up)\')">Zkopirovat</button><div class="msg" id="csMsg"></div>');
}

function exportUsersCSV(){
  var rows=[['Jmeno','Email','Role','Prodejna','Kategorie','Osobní body','Body prodejny','Liga','Sankce','Poslední aktivita','Sezóna']];
  var rankedU=getRankedUsers();
  for(var i=0;i<rankedU.length;i++){
    var ru=rankedU[i];var s=getStore(ru.storeId);var storePts=getStoreEffPts(ru.storeId);
    var pen=0;for(var j=0;j<DATA.completions.length;j++){var c=DATA.completions[j];if(c.userId===ru.id&&c.points<0)pen+=c.points;}
    var lastAct='';for(var k=DATA.completions.length-1;k>=0;k--){if(DATA.completions[k].userId===ru.id){lastAct=DATA.completions[k].date;break;}}
    rows.push([ru.name,ru.email,ru.role==='provozni'?'Provozní':'Prodavačka',s?s.name:'',s?s.category+' x'+s.hcp.toFixed(1):'',ru.pts,storePts,getLeague(ru.pts).name,pen,lastAct,DATA.season.title]);
  }
  var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var now=new Date();var pad=function(n){return n<10?'0'+n:String(n);};
  var fname='LL-prehled-'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'.csv';
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);
}

function getSnapshots(){try{return JSON.parse(localStorage.getItem('ll_v4_snapshots')||'[]');}catch(e){return[];}}
function saveSnapshots(arr){localStorage.setItem('ll_v4_snapshots',JSON.stringify(arr));}
function createSnapshot(silent){var now=new Date();var pad=function(n){return n<10?'0'+n:String(n);};var label=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear()+' '+pad(now.getHours())+':'+pad(now.getMinutes());var snap={label:label,data:JSON.parse(JSON.stringify(DATA)),users:DATA.users.length,completions:DATA.completions.length};var arr=getSnapshots();arr.push(snap);if(arr.length>20)arr=arr.slice(arr.length-20);saveSnapshots(arr);localStorage.setItem('ll_v4_last_save',label);if(!silent){showMsg('backupMsg','Zaloha: '+label,'var(--up)');setTimeout(function(){renderAdminSettings();},1500);}}
function restoreSnapshot(idx){var arr=getSnapshots();if(!arr[idx])return;if(!confirm('Obnovit zalohu z '+arr[idx].label+'?'))return;DATA=JSON.parse(JSON.stringify(arr[idx].data));saveData(null);renderAdminSettings();}
function exportJSON(){var json=JSON.stringify(DATA,null,2);var now=new Date();var pad=function(n){return n<10?'0'+n:String(n);};var fname='LL-vyzva-backup-'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes())+'.json';var blob=new Blob([json],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);}
function loadJSONFile(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var ta=document.getElementById('importJsonArea');if(ta)ta.value=e.target.result;};reader.readAsText(file);}
function importJSON(){var raw='';var ta=document.getElementById('importJsonArea');if(ta)raw=ta.value.trim();if(!raw){showMsg('backupMsg','Zvolte soubor nebo vložte JSON','oklch(0.65 0.20 25)');return;}try{var parsed=JSON.parse(raw);if(!parsed.stores||!parsed.challenges){showMsg('backupMsg','Neplatný formát','oklch(0.65 0.20 25)');return;}if(!confirm('Importovat? Prepise vsechna aktualni data.'))return;DATA=parsed;saveData(null);showMsg('backupMsg','Importováno','var(--up)');setTimeout(renderAdminOverview,800);}catch(e){showMsg('backupMsg','Chyba JSON','oklch(0.65 0.20 25)');}}

if(!Array.prototype.find){Array.prototype.find=function(fn){for(var i=0;i<this.length;i++)if(fn(this[i]))return this[i];return undefined;};}
if(!Array.prototype.filter){Array.prototype.filter=function(fn){var r=[];for(var i=0;i<this.length;i++)if(fn(this[i]))r.push(this[i]);return r;};}

init();

</script>
