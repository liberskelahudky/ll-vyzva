<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LL Výzva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0A0A0D;--surface:#141417;--surface2:#1C1C20;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F2F0EB;--muted:#6B6868;--dim:#3D3B3B;
  --accent:oklch(0.75 0.14 75);--up:oklch(0.72 0.16 150);--down:oklch(0.65 0.20 25);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',system-ui;}

/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;z-index:10;background:radial-gradient(ellipse 80% 50% at 50% -5%,color-mix(in oklab,var(--accent) 15%,transparent) 0%,transparent 70%),var(--bg);}
.login-logo{font-size:64px;margin-bottom:16px;}
.login-brand{font-family:'Space Grotesk',system-ui;font-size:28px;font-weight:800;letter-spacing:-0.8px;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:40px;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:28px 22px;width:100%;max-width:320px;box-shadow:0 32px 80px rgba(0,0,0,0.5);}
.step{transition:opacity 0.2s;}
.flabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;display:block;}
.finput{width:100%;padding:14px 16px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:12px;color:var(--text);font-family:'Inter',system-ui;font-size:15px;outline:none;transition:border-color 0.2s;}
.finput:focus{border-color:var(--accent);}
.btn-main{width:100%;padding:14px;background:var(--accent);color:#0A0A0D;border:none;border-radius:12px;font-family:'Inter',system-ui;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px color-mix(in oklab,var(--accent) 35%,transparent);margin-top:10px;}
.err-msg{font-size:13px;font-weight:700;color:var(--down);text-align:center;margin-top:10px;min-height:18px;}
/* PIN */
.pin-dots{display:flex;gap:20px;justify-content:center;margin:20px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);transition:all 0.15s;}
.pin-dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.np{padding:0;height:60px;border-radius:14px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:'Space Grotesk',system-ui;font-size:22px;font-weight:600;cursor:pointer;transition:background 0.1s;}
.np:active{background:var(--surface);}
.np.emp{background:none;border:none;cursor:default;}
.np.del{font-size:20px;}
.back-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:16px;padding:0;display:flex;align-items:center;gap:6px;}

/* ── APP SHELL ── */
#appShell{position:fixed;inset:0;display:none;flex-direction:column;}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom);}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;color:var(--muted);font-family:'Space Grotesk',system-ui;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;cursor:pointer;transition:color 0.15s;}
.tab-btn .ti{font-size:20px;}
.tab-btn.on{color:var(--accent);}
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px;}
@keyframes toastPop{0%{opacity:0;transform:translateX(-50%) scale(0.85);}15%{opacity:1;transform:translateX(-50%) scale(1);}85%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(0.95);}}
@keyframes popIn{from{opacity:0;transform:scale(0.85);}to{opacity:1;transform:scale(1);}}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;padding:0;}
.modal-ov.hidden{display:none;}
.modal-box{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:22px 18px 32px;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-family:'Space Grotesk',system-ui;font-size:18px;font-weight:700;letter-spacing:-0.3px;margin-bottom:18px;}

/* ── SHARED COMPONENTS ── */
.progress-bar{height:var(--h,6px);background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;transition:width 0.6s;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-logo">🏆</div>
  <div class="login-brand">LL Výzva</div>
  <div class="login-sub">Body · Ligy · Odměny</div>
  <div class="login-card">
    <!-- Step 1: Email -->
    <div id="stepEmail">
      <div class="flabel">Váš pracovní email</div>
      <input class="finput" id="emailInput" type="email" inputmode="email" placeholder="vas@email.cz" onkeydown="if(event.key==='Enter')submitEmail()">
      <button class="btn-main" onclick="submitEmail()">Pokračovat →</button>
      <div class="err-msg" id="emailErr"></div>
      <div style="text-align:center;margin-top:20px;font-size:11px;color:var(--dim);">Admin přihlášení je na samostatné stránce</div>
    </div>
    <!-- Step 2: PIN -->
    <div id="stepPin" style="display:none;">
      <button class="back-btn" onclick="backToEmail()">← Zpět</button>
      <div id="pinUserName" style="font-family:'Space Grotesk',system-ui;font-size:16px;font-weight:700;margin-bottom:2px;"></div>
      <div id="pinUserRole" style="font-size:12px;color:var(--muted);margin-bottom:20px;"></div>
      <div class="flabel" style="text-align:center;">Zadejte PIN</div>
      <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
      <div class="numpad">
        <button class="np" onclick="npPress('1')">1</button><button class="np" onclick="npPress('2')">2</button><button class="np" onclick="npPress('3')">3</button>
        <button class="np" onclick="npPress('4')">4</button><button class="np" onclick="npPress('5')">5</button><button class="np" onclick="npPress('6')">6</button>
        <button class="np" onclick="npPress('7')">7</button><button class="np" onclick="npPress('8')">8</button><button class="np" onclick="npPress('9')">9</button>
        <button class="np emp"></button><button class="np" onclick="npPress('0')">0</button><button class="np del" onclick="npDel()">⌫</button>
      </div>
      <div class="err-msg" id="pinErr"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appShell">
  <div class="scroll-area" id="scrollArea">
    <div id="pageContent"></div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn on" id="tb0" onclick="goTab('home',this)"><div class="ti">🏠</div>Přehled</button>
    <button class="tab-btn" id="tb1" onclick="goTab('challenges',this)"><div class="ti">⚡</div>Výzvy</button>
    <button class="tab-btn" id="tb2" onclick="goTab('leaderboard',this)"><div class="ti">🏆</div>Žebříček</button>
    <button class="tab-btn" id="tb3" onclick="goTab('rewards',this)"><div class="ti">🎁</div>Odměny</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-ov hidden" id="modalOv" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
var GH_TOKEN_KEY='ll_v4_token', GH_GIST_KEY='ll_v4_gist', DATA_KEY='ll_v4_data', SESSION_KEY='ll_v4_session', GIST_FILE='ll-vyzva4-data.json';
var LEAGUES=[{name:'Bronzová',min:0,color:'oklch(0.58 0.10 50)'},{name:'Stříbrná',min:200,color:'oklch(0.75 0.02 260)'},{name:'Zlatá',min:500,color:'oklch(0.78 0.14 85)'},{name:'Diamantová',min:900,color:'oklch(0.82 0.10 210)'}];

// ── STATE ────────────────────────────────────────────────────
var DATA=null, SESSION={userId:null,storeId:null,role:null,userName:'',userEmail:''};
var UI={tab:'home',lbTab:'stores',chFilter:'all'}, GH={token:'',gistId:''};
var PIN_BUF='', LOGIN_USER=null;

// ── HELPERS ──────────────────────────────────────────────────
function getLeague(pts){var l=LEAGUES[0];for(var i=0;i<LEAGUES.length;i++)if(pts>=LEAGUES[i].min)l=LEAGUES[i];return l;}
function getNextLeague(pts){var idx=0;for(var i=0;i<LEAGUES.length;i++)if(pts>=LEAGUES[i].min)idx=i;return idx<LEAGUES.length-1?LEAGUES[idx+1]:null;}
function getLeaguePct(pts){var c=getLeague(pts),n=getNextLeague(pts);if(!n)return 1;return(pts-c.min)/(n.min-c.min);}
function getStore(id){if(!DATA)return null;for(var i=0;i<DATA.stores.length;i++)if(DATA.stores[i].id===id)return DATA.stores[i];return null;}
function getUser(id){if(!DATA)return null;for(var i=0;i<DATA.users.length;i++)if(DATA.users[i].id===id)return DATA.users[i];return null;}
function getUserByEmail(email){var e=email.toLowerCase().trim();if(!DATA)return null;for(var i=0;i<DATA.users.length;i++)if(DATA.users[i].email.toLowerCase()===e)return DATA.users[i];return null;}
function getCh(id){if(!DATA)return null;for(var i=0;i<DATA.challenges.length;i++)if(DATA.challenges[i].id===id)return DATA.challenges[i];return null;}
function getUserPts(uid){var p=0;if(!DATA)return 0;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.userId===uid&&(c.scope==='personal'||c.scope==='both'||!c.scope))p+=c.points;}return Math.max(0,p);}
function getStoreRaw(sid){var p=0;if(!DATA)return 0;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.storeId===sid&&(c.scope==='store'||c.scope==='both'||!c.scope))p+=c.points;}return p;}
function getStoreEff(sid){var s=getStore(sid);return Math.max(0,Math.round(getStoreRaw(sid)*(s?s.hcp:1)));}
function getStoreRank(sid){var arr=DATA.stores.map(function(s){return{id:s.id,e:getStoreEff(s.id)};}).sort(function(a,b){return b.e-a.e;});for(var i=0;i<arr.length;i++)if(arr[i].id===sid)return i+1;return arr.length;}
function getProgress(sid,chid){if(!DATA)return 0;for(var i=0;i<DATA.progress.length;i++){var p=DATA.progress[i];if(p.storeId===sid&&p.challengeId===chid)return p.current;}return 0;}
function isCompleteStore(sid,chid){if(!DATA)return false;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.storeId===sid&&c.challengeId===chid)return true;}return false;}
function today(){var d=new Date();return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();}
function fmtNum(n){return Math.round(n).toLocaleString('cs-CZ').replace(/,/g,' ');}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){var r='';for(var i=0;i<s.length;i++){r+=s[i]==='\n'?'<br>':s[i];}return r;}
function progressBar(v,max,color,h){var pct=max>0?Math.min(100,(v/max)*100):0;h=h||6;return '<div class="progress-bar" style="--h:'+h+'px"><div class="progress-fill" style="width:'+pct+'%;background:'+color+';box-shadow:0 0 10px '+color+';"></div></div>';}
function leagueBadge(name){var l=getLeague(0);for(var i=0;i<LEAGUES.length;i++)if(LEAGUES[i].name===name)l=LEAGUES[i];return '<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:color-mix(in oklab,'+l.color+' 14%,transparent);border:0.5px solid color-mix(in oklab,'+l.color+' 35%,transparent);color:'+l.color+';font-size:10px;font-weight:600;font-family:Space Grotesk,system-ui;"><span style="width:6px;height:6px;border-radius:50%;background:'+l.color+';box-shadow:0 0 6px '+l.color+';display:inline-block;"></span>'+esc(name)+'</span>';}
function avatar(initials,color,size){size=size||40;return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+color+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:'+(size*0.36)+'px;color:#0A0A0D;flex-shrink:0;font-family:Space Grotesk,system-ui;">'+esc(initials)+'</div>';}
var SC=['oklch(0.72 0.16 70)','oklch(0.70 0.16 300)','oklch(0.72 0.15 160)','oklch(0.68 0.18 25)','oklch(0.75 0.12 220)','oklch(0.70 0.14 340)','oklch(0.72 0.14 100)','oklch(0.66 0.16 40)'];
function storeColor(idx){return SC[idx%SC.length];}
function initials(name){return name.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();}

// ── DATA LOAD ────────────────────────────────────────────────
function loadData(cb){
  GH.token=localStorage.getItem(GH_TOKEN_KEY)||'';GH.gistId=localStorage.getItem(GH_GIST_KEY)||'';
  if(GH.token&&GH.gistId){
    var xhr=new XMLHttpRequest();xhr.open('GET','https://api.github.com/gists/'+GH.gistId);
    xhr.setRequestHeader('Authorization','token '+GH.token);
    xhr.onload=function(){if(xhr.status===200){try{var d=JSON.parse(xhr.responseText);var f=d.files[GIST_FILE];if(f&&f.content){DATA=JSON.parse(f.content);localStorage.setItem(DATA_KEY,f.content);}}catch(e){loadLocal();}}else loadLocal();if(cb)cb();};
    xhr.onerror=function(){loadLocal();if(cb)cb();};xhr.send();
  }else{loadLocal();if(cb)cb();}
}
function loadLocal(){var s=localStorage.getItem(DATA_KEY);if(s){try{DATA=JSON.parse(s);}catch(e){}}if(!DATA)DATA={users:[],stores:[],challenges:[],progress:[],completions:[],prizes:[],season:{title:'Jaro 2026',startDate:'1. 4. 2026',active:true},sheetsUrl:''};}

// ── AUTH ─────────────────────────────────────────────────────
function init(){
  var sess=localStorage.getItem(SESSION_KEY);
  if(sess){try{SESSION=JSON.parse(sess);}catch(e){}}
  loadData(function(){
    if(SESSION.userId)showApp();
    else showLogin();
  });
}
function showLogin(){document.getElementById('loginScreen').style.display='flex';document.getElementById('appShell').style.display='none';}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').style.display='flex';goTab('home',document.getElementById('tb0'));}
function submitEmail(){
  var email=document.getElementById('emailInput').value.trim();
  var user=getUserByEmail(email);
  if(!user||!user.active){document.getElementById('emailErr').textContent='Email nenalezen nebo účet není aktivní.';return;}
  LOGIN_USER=user;PIN_BUF='';updateDots();
  document.getElementById('stepEmail').style.display='none';
  document.getElementById('stepPin').style.display='block';
  document.getElementById('pinUserName').textContent=user.name;
  document.getElementById('pinUserRole').textContent=user.role==='provozni'?'Provozní':'Prodavačka';
  document.getElementById('pinErr').textContent='';
}
function backToEmail(){document.getElementById('stepPin').style.display='none';document.getElementById('stepEmail').style.display='block';PIN_BUF='';}
function npPress(d){if(PIN_BUF.length>=4)return;PIN_BUF+=d;updateDots();if(PIN_BUF.length===4)setTimeout(checkPin,180);}
function npDel(){PIN_BUF=PIN_BUF.slice(0,-1);updateDots();document.getElementById('pinErr').textContent='';}
function updateDots(){for(var i=0;i<4;i++){var el=document.getElementById('pd'+i);if(el){if(i<PIN_BUF.length)el.classList.add('on');else el.classList.remove('on');}}}
function checkPin(){
  if(LOGIN_USER&&PIN_BUF===LOGIN_USER.pin){
    SESSION={userId:LOGIN_USER.id,storeId:LOGIN_USER.storeId,role:LOGIN_USER.role,userName:LOGIN_USER.name,userEmail:LOGIN_USER.email};
    localStorage.setItem(SESSION_KEY,JSON.stringify(SESSION));showApp();
  }else{document.getElementById('pinErr').textContent='Nesprávný PIN';PIN_BUF='';updateDots();}
}
function doLogout(){localStorage.removeItem(SESSION_KEY);SESSION={userId:null,storeId:null,role:null,userName:'',userEmail:''};PIN_BUF='';LOGIN_USER=null;document.getElementById('stepPin').style.display='none';document.getElementById('stepEmail').style.display='block';document.getElementById('emailInput').value='';document.getElementById('emailErr').textContent='';showLogin();}

// ── ROUTING ──────────────────────────────────────────────────
function goTab(tab,btn){UI.tab=tab;document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');document.getElementById('scrollArea').scrollTop=0;render();}
function render(){if(UI.tab==='home')renderHome();else if(UI.tab==='challenges')renderChallenges();else if(UI.tab==='leaderboard')renderLeaderboard();else if(UI.tab==='rewards')renderRewards();}

// ── HOME ─────────────────────────────────────────────────────
function renderHome(){
  var uid=SESSION.userId,sid=SESSION.storeId;
  var userPts=getUserPts(uid),storePts=getStoreEff(sid);
  var league=getLeague(userPts),nextLeague=getNextLeague(userPts);
  var rank=getStoreRank(sid),total=DATA.stores.length;
  var store=getStore(sid),storeName=store?store.name.split('-')[0].trim():'Prodejna';
  var roleLabel=SESSION.role==='provozni'?'Provozní':'Prodavačka';
  // week chart
  var now2=new Date(),dow=now2.getDay();
  var monday=new Date(now2);monday.setDate(now2.getDate()-(dow===0?6:dow-1));monday.setHours(0,0,0,0);
  var days=['Po','Út','St','Čt','Pá','So','Ne'],weekData=[];
  for(var wi=0;wi<7;wi++){var day=new Date(monday);day.setDate(monday.getDate()+wi);var ds=day.getDate()+'.'+(day.getMonth()+1)+'.'+day.getFullYear();var pts=0;for(var wj=0;wj<DATA.completions.length;wj++){var wc=DATA.completions[wj];if((wc.storeId===sid||wc.userId===uid)&&wc.date===ds&&wc.points>0)pts+=wc.points;}weekData.push({d:days[wi],v:pts,isToday:(wi===(dow===0?6:dow-1))});}
  var weekMax=0,weekTotal=0;for(var wk=0;wk<weekData.length;wk++){if(weekData[wk].v>weekMax)weekMax=weekData[wk].v;weekTotal+=weekData[wk].v;}
  // recent comps
  var recentComps=DATA.completions.filter(function(c){return c.storeId===sid||c.userId===uid;}).slice(-5).reverse();
  var storeIdx=0;for(var si2=0;si2<DATA.stores.length;si2++)if(DATA.stores[si2].id===sid){storeIdx=si2;break;}

  var h='';
  // top bar
  h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;">';
  h+=avatar(initials(SESSION.userName),storeColor(storeIdx),40);
  h+='<div style="flex:1;margin-left:12px;"><div style="font-size:11px;color:var(--muted);">'+esc(roleLabel)+' · '+esc(storeName)+'</div><div style="font-size:15px;font-weight:600;letter-spacing:-0.2px;">'+esc(SESSION.userName)+'</div></div>';
  h+='<button onclick="doLogout()" style="width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:14px;">⎋</button>';
  h+='</div>';
  // hero card
  h+='<div style="padding:4px 16px 0;"><div style="padding:22px;border-radius:28px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in oklab,oklch(0.68 0.20 295) 28%,transparent) 0%,transparent 55%),radial-gradient(120% 120% at 0% 100%,color-mix(in oklab,var(--accent) 24%,transparent) 0%,transparent 50%),#13131A;border:1px solid rgba(255,255,255,0.07);">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">';
  h+='<div><div style="font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:600;font-family:Space Grotesk,system-ui;">Moje body</div>';
  h+='<div style="display:flex;align-items:baseline;gap:6px;margin-top:2px;"><span id="ptsAnim" style="font-family:Space Grotesk,system-ui;font-weight:700;font-size:42px;letter-spacing:-1.5px;color:var(--text);line-height:1;">'+fmtNum(userPts)+'</span><span style="font-size:13px;color:var(--muted);">osobní</span></div></div>';
  h+=leagueBadge(league.name);
  h+='</div>';
  if(nextLeague){h+='<div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px;"><span style="color:var(--muted);">Do ligy '+esc(nextLeague.name)+'</span><span style="color:var(--text);font-weight:600;font-family:Space Grotesk,system-ui;">'+fmtNum(nextLeague.min-userPts)+' bodů</span></div>';h+=progressBar(getLeaguePct(userPts)*100,100,nextLeague.color,7);}
  else{h+=progressBar(100,100,league.color,7);h+='<div style="text-align:right;font-size:12px;color:var(--accent);font-weight:700;margin-top:4px;">🏆 Diamantová liga</div>';}
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;gap:6px;">';

      }else{
        h+='<div style="padding:16px 14px 0;display:flex;align-items:center;gap:10px;"><div style="width:44px;height:44px;border-radius:14px;flex-shrink:0;background:color-mix(in oklab,var(--accent) 12%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;">'+esc(pr.emoji)+'</div>';
        h+='<div style="flex:1;"><div style="font-size:16px;font-weight:700;">'+esc(pr.title)+'</div><div style="font-size:12px;color:var(--muted);">'+fmtNum(pr.points)+' bodů</div></div></div>';
        h+='<div style="padding:10px 14px 14px;">';
      }
      h+='<div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px;">'+esc(pr.description||'')+'</div>';
      h+=progressBar(Math.min(avPts,pr.points),pr.points,'var(--accent)',5);
      h+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px;"><span style="color:var(--muted);">'+fmtNum(Math.min(avPts,pr.points))+' / '+fmtNum(pr.points)+' bodů</span><span style="color:'+(avail?'var(--up)':'var(--muted)')+';font-weight:700;">'+(avail?'✓ Odemčeno':'ještě '+fmtNum(pr.points-avPts)+' b')+'</span></div>';
      if(pr.rules)h+='<div style="font-size:11px;color:var(--dim);margin-top:6px;">📋 Pravidla · klepni pro detail</div>';
      h+='</div></div>';
    }
  }
  h+='<div style="height:20px;"></div></div>';
  document.getElementById('pageContent').innerHTML=h;
}
function openRewardDetail(pid){
  var pr=null;for(var i=0;i<DATA.prizes.length;i++)if(DATA.prizes[i].id===pid)pr=DATA.prizes[i];if(!pr)return;
  var tierMap={'Tymova':'Týmová','Osobni - prodavacka':'Osobní – prodavačka','Osobni - provozni':'Osobní – provozní'};
  var tier=tierMap[pr.tier]||pr.tier;
  var sid=SESSION.storeId,uid=SESSION.userId;
  var pts=tier==='Týmová'?getStoreEff(sid):getUserPts(uid);
  var avail=pts>=pr.points;var pct=Math.min(100,Math.round(pts/pr.points*100));
  var b='';
  if(pr.imageUrl){b+='<div style="margin:-18px -18px 16px;height:160px;overflow:hidden;border-radius:8px 8px 0 0;"><img src="'+esc(pr.imageUrl)+'" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.style.display=\'none\'"></div>';}
  else{b+='<div style="text-align:center;font-size:52px;margin-bottom:12px;">'+esc(pr.emoji)+'</div>';}
  b+='<div style="font-size:14px;color:var(--text);line-height:1.65;margin-bottom:14px;">'+esc(pr.description||'')+'</div>';
  if(pr.rules){b+='<div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;">📋 Pravidla</div><div style="font-size:13px;color:var(--text);line-height:1.7;">'+nl2br(esc(pr.rules))+'</div></div>';}
  b+=progressBar(Math.min(pts,pr.points),pr.points,'var(--accent)',6);
  b+='<div style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 16px;">'+fmtNum(Math.min(pts,pr.points))+' / '+fmtNum(pr.points)+' bodů ('+pct+' %)</div>';
  if(avail){b+='<div style="background:color-mix(in oklab,var(--up) 10%,transparent);border:1px solid color-mix(in oklab,var(--up) 25%,transparent);border-radius:12px;padding:14px;text-align:center;font-size:13px;color:var(--up);font-weight:700;">✓ Odemčeno – kontaktujte Jitku nebo Meggy pro uplatnění</div>';}
  else{b+='<div style="text-align:center;padding:14px;background:rgba(255,255,255,0.04);border-radius:12px;font-size:13px;color:var(--muted);">Ještě <strong>'+fmtNum(pr.points-pts)+' bodů</strong> do odemčení</div>';}
  openModal(esc(pr.title),b);
}

// ── MODAL ────────────────────────────────────────────────────
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalOv').classList.remove('hidden');}
function closeModal(){document.getElementById('modalOv').classList.add('hidden');}

if(!Array.prototype.filter){Array.prototype.filter=function(fn){var r=[];for(var i=0;i<this.length;i++)if(fn(this[i]))r.push(this[i]);return r;};}
if(!Array.prototype.find){Array.prototype.find=function(fn){for(var i=0;i<this.length;i++)if(fn(this[i]))return this[i];return undefined;};}
if(!Object.assign){Object.assign=function(t){for(var i=1;i<arguments.length;i++){var s=arguments[i];for(var k in s)if(s.hasOwnProperty(k))t[k]=s[k];}return t;};}

init();
</script>
