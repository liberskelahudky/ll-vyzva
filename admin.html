<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LL Výzva — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0D0D0F;--surface:#161618;--surface2:#1E1E21;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#F0EEE8;--muted:#7A7875;--dim:#4A4845;--accent:#E8A020;--up:#2DB87A;--down:#E05050;--purple:#9B6DFF;--font:'Sora',system-ui;--mono:'DM Mono',monospace;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;}
/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(232,160,32,0.12) 0%,transparent 70%),var(--bg);}
.login-box{width:100%;max-width:380px;}
{font-size:36px;font-weight:800;letter-spacing:-1.5px;margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:36px;}

.login-input{width:100%;padding:15px 18px;background:var(--surface);border:1.5px solid var(--border2);border-radius:12px;color:var(--text);font-family:var(--mono);font-size:16px;outline:none;transition:border-color 0.2s;letter-spacing:3px;margin-bottom:12px;}
.login-input::placeholder{letter-spacing:0;font-family:var(--font);color:var(--dim);}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:15px;background:var(--accent);color:#0D0D0F;border:none;border-radius:12px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;}
.login-err{font-size:13px;color:var(--down);font-weight:700;margin-top:10px;min-height:20px;}
/* LAYOUT */
#adminMain{display:none;}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sb-logo{padding:24px 20px 20px;border-bottom:1px solid var(--border);}
.sb-tag{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-family:var(--mono);margin-bottom:4px;}
.sb-name{font-size:16px;font-weight:800;letter-spacing:-0.4px;}
.sb-season{font-size:11px;color:var(--muted);margin-top:2px;}
.sb-nav{padding:16px 10px;flex:1;}
.sb-sec{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding:0 10px;margin:16px 0 6px;}
.sb-sec:first-child{margin-top:0;}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;border:none;background:none;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;text-align:left;}
.sb-btn:hover{background:var(--surface2);color:var(--text);}
.sb-btn.on{background:rgba(232,160,32,0.12);color:var(--accent);font-weight:600;}
.sb-ico{width:16px;text-align:center;font-size:14px;}
.sb-footer{padding:16px 20px;border-top:1px solid var(--border);}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up);margin-right:6px;}
.sync-txt{font-size:11px;color:var(--muted);margin-bottom:10px;}
.logout-btn{width:100%;padding:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;}
.logout-btn:hover{border-color:var(--down);color:var(--down);}
/* MAIN */
.main{overflow-x:hidden;}
.ph{padding:32px 36px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(232,160,32,0.03) 0%,transparent 100%);}
.ph-title{font-size:26px;font-weight:800;letter-spacing:-0.8px;margin-bottom:4px;}
.ph-sub{font-size:13px;color:var(--muted);}
.pb{padding:28px 36px;}
/* COMPONENTS */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;}
.stat-v{font-size:28px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;color:var(--accent);line-height:1;}
.stat-l{font-size:10px;color:var(--muted);margin-top:5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.card-t{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-bottom:14px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-size:15px;font-weight:700;letter-spacing:-0.2px;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--dim);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);font-family:var(--mono);}
td{padding:12px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
/* FORMS */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg.one{grid-template-columns:1fr;}
.fg.three{grid-template-columns:1fr 1fr 1fr;}
.frow{display:flex;flex-direction:column;gap:5px;}
.flabel{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);font-family:var(--mono);}
.finput,.fsel,.ftarea{padding:10px 13px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:9px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color 0.2s;width:100%;}
.finput:focus,.fsel:focus,.ftarea:focus{border-color:var(--accent);}
.fsel option{background:var(--surface2);}
.ftarea{resize:vertical;min-height:76px;line-height:1.5;}
.btn-p{padding:10px 18px;background:var(--accent);color:#0D0D0F;border:none;border-radius:9px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;}
.btn-p:hover{opacity:0.9;}
.btn-p.full{width:100%;padding:12px;}
.btn-s{padding:9px 16px;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);border-radius:9px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}
.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-d{padding:9px 16px;background:rgba(224,80,80,0.1);border:1.5px solid rgba(224,80,80,0.25);color:var(--down);border-radius:9px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px;}
.act{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.sep{height:1px;background:var(--border);margin:20px 0;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;font-family:var(--mono);}
.b-prod{background:rgba(232,160,32,0.12);color:var(--accent);}
.b-prov{background:rgba(155,109,255,0.12);color:var(--purple);}
.b-a{background:rgba(45,184,122,0.12);color:var(--up);}
.b-b{background:rgba(232,85,32,0.12);color:#E85520;}
.b-c{background:rgba(224,80,80,0.12);color:var(--down);}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;font-family:var(--mono);}
.pill-g{background:rgba(45,184,122,0.12);color:var(--up);}
.pill-r{background:rgba(224,80,80,0.12);color:var(--down);}
.pill-o{background:rgba(232,160,32,0.12);color:var(--accent);}
.msg{font-size:12px;font-weight:700;min-height:18px;font-family:var(--mono);}
.info{background:rgba(232,160,32,0.06);border:1px solid rgba(232,160,32,0.2);border-radius:9px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6;}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-ov.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:26px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;}
.modal-x{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* QUIZ BUILDER */
.qblock{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.qblock-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-family:var(--mono);}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;}
.correct-btns{display:flex;gap:6px;margin-top:8px;}
.cb{padding:6px 12px;border-radius:7px;border:1.5px solid var(--border);background:none;color:var(--text);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--mono);}
.cb.on{border-color:var(--up);background:rgba(45,184,122,0.12);color:var(--up);}
/* PROGRESS */
.prog-row{display:grid;grid-template-columns:1fr 100px 60px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.pbar{height:4px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;}
.pfill{height:100%;border-radius:999px;background:var(--accent);}
/* SETTINGS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sc{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px;}
.sc-t{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-bottom:14px;}
.code-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:var(--mono);font-size:10px;color:var(--text);line-height:1.6;max-height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.pb{animation:fadeIn 0.2s ease-out;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-tag">LL Výzva / Admin Panel</div>
    <div class="login-title">Správa<br>sezóny</div>
    <div class="login-sub">Přihlaste se administrátorským heslem</div>
    <input class="login-input" type="password" id="pwInput" placeholder="Heslo" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Přihlásit se →</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN -->
<div id="adminMain">
<div class="layout">
  <div class="sidebar">
    <div class="sb-logo">
      <div class="sb-tag">LL · Admin</div>
      <div class="sb-name">Výzva Panel</div>
      <div class="sb-season" id="sbSeason">Jaro 2026</div>
    </div>
    <div class="sb-nav">
      <div class="sb-sec">Přehled</div>
      <button class="sb-btn on" id="sbn-overview" onclick="nav('overview',this)"><span class="sb-ico">📊</span>Dashboard</button>
      <button class="sb-btn" id="sbn-users" onclick="nav('users',this)"><span class="sb-ico">👤</span>Uživatelé</button>
      <button class="sb-btn" id="sbn-stores" onclick="nav('stores',this)"><span class="sb-ico">🏪</span>Prodejny</button>
      <div class="sb-sec">Body</div>
      <button class="sb-btn" id="sbn-addpts" onclick="nav('addpts',this)"><span class="sb-ico">⚡</span>Zadat body</button>
      <button class="sb-btn" id="sbn-log" onclick="nav('log',this)"><span class="sb-ico">📋</span>Přehled akcí</button>
      <div class="sb-sec">Obsah</div>
      <button class="sb-btn" id="sbn-challenges" onclick="nav('challenges',this)"><span class="sb-ico">🎯</span>Výzvy</button>
      <button class="sb-btn" id="sbn-prizes" onclick="nav('prizes',this)"><span class="sb-ico">🎁</span>Odměny</button>
      <div class="sb-sec">Systém</div>
      <button class="sb-btn" id="sbn-backup" onclick="nav('backup',this)"><span class="sb-ico">💾</span>Zálohy</button>
      <button class="sb-btn" id="sbn-settings" onclick="nav('settings',this)"><span class="sb-ico">🔧</span>Nastavení</button>
    </div>
    <div class="sb-footer">
      <div class="sync-txt"><span class="sync-dot"></span><span id="syncStatus">Připraveno</span></div>
      <button class="logout-btn" onclick="doLogout()">Odhlásit se</button>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>
</div>

<!-- MODAL -->
<div class="modal-ov hidden" id="modalOv" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
var ADMIN_PW_KEY='ll_v4_admin_pw', GH_TOKEN_KEY='ll_v4_token', GH_GIST_KEY='ll_v4_gist';
var DATA_KEY='ll_v4_data', GIST_FILE='ll-vyzva4-data.json', SHEETS_KEY='ll_v4_sheets';
var DEFAULT_PW='0000';
var LEAGUES=[{name:'Bronzová',min:0,color:'#B87333'},{name:'Stříbrná',min:200,color:'#C0C0C0'},{name:'Zlatá',min:500,color:'#E8A020'},{name:'Diamantová',min:900,color:'#9B6DFF'}];
var ACTION_TYPES=[
  {id:'tasky',label:'Prodej tašek',unit:'ks',ptsEach:25,scope:'personal',cat:'vykon'},
  {id:'upsell',label:'Upsell (dezert/doplněk)',unit:'ks',ptsEach:20,scope:'personal',cat:'vykon'},
  {id:'napoj',label:'Prodej nápoj/víno',unit:'ks',ptsEach:10,scope:'personal',cat:'vykon'},
  {id:'review5',label:'Recenze 5★',unit:'ks',ptsEach:50,scope:'both',cat:'marketing'},
  {id:'review4',label:'Recenze 4★',unit:'ks',ptsEach:20,scope:'both',cat:'marketing'},
  {id:'review3',label:'Recenze 3★ a méně',unit:'ks',ptsEach:0,scope:'both',cat:'marketing'},
  {id:'foto',label:'Foto pro IG (schváleno)',unit:'ks',ptsEach:12,scope:'personal',cat:'marketing'},
  {id:'video',label:'Video pro IG (schváleno)',unit:'ks',ptsEach:20,scope:'personal',cat:'marketing'},
  {id:'catering',label:'Catering objednávka',unit:'ks',ptsEach:60,scope:'store',cat:'vykon'},
  {id:'open',label:'Otevření včas (týden)',unit:'ks',ptsEach:10,scope:'store',cat:'provoz'},
  {id:'cistota',label:'Čistota 10/10 (kontrola)',unit:'ks',ptsEach:80,scope:'store',cat:'provoz'},
  {id:'zakoleni',label:'Zaškolení nového kolegy',unit:'ks',ptsEach:60,scope:'personal',cat:'tym'},
  {id:'reseni',label:'Samostatné řešení situace',unit:'ks',ptsEach:50,scope:'personal',cat:'tym'},
  {id:'bonus',label:'Bonus (vlastní)',unit:'b',ptsEach:1,scope:'both',cat:'vykon'}
];

// ── STATE ────────────────────────────────────────────────────
var DATA=null, GH={token:'',gistId:''}, PAGE='overview';
var NEWQUIZ={title:'',emoji:'🧠',category:'marketing',pointsEach:10,questions:[]};

// ── HELPERS ──────────────────────────────────────────────────
function getLeague(pts){var l=LEAGUES[0];for(var i=0;i<LEAGUES.length;i++)if(pts>=LEAGUES[i].min)l=LEAGUES[i];return l;}
function getStore(id){if(!DATA)return null;for(var i=0;i<DATA.stores.length;i++)if(DATA.stores[i].id===id)return DATA.stores[i];return null;}
function getUser(id){if(!DATA)return null;for(var i=0;i<DATA.users.length;i++)if(DATA.users[i].id===id)return DATA.users[i];return null;}
function getCh(id){if(!DATA)return null;for(var i=0;i<DATA.challenges.length;i++)if(DATA.challenges[i].id===id)return DATA.challenges[i];return null;}
function getPrize(id){if(!DATA)return null;for(var i=0;i<DATA.prizes.length;i++)if(DATA.prizes[i].id===id)return DATA.prizes[i];return null;}
function getUserPts(uid){var p=0;if(!DATA)return 0;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.userId===uid&&(c.scope==='personal'||c.scope==='both'||!c.scope))p+=c.points;}return Math.max(0,p);}
function getStoreRaw(sid){var p=0;if(!DATA)return 0;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.storeId===sid&&(c.scope==='store'||c.scope==='both'||!c.scope))p+=c.points;}return p;}
function getStoreEff(sid){var s=getStore(sid);return Math.max(0,Math.round(getStoreRaw(sid)*(s?s.hcp:1)));}
function getProgress(sid,chid){if(!DATA)return 0;for(var i=0;i<DATA.progress.length;i++){var p=DATA.progress[i];if(p.storeId===sid&&p.challengeId===chid)return p.current;}return 0;}
function setProgress(sid,chid,val){for(var i=0;i<DATA.progress.length;i++){if(DATA.progress[i].storeId===sid&&DATA.progress[i].challengeId===chid){DATA.progress[i].current=val;return;}}DATA.progress.push({storeId:sid,challengeId:chid,current:val});}
function isCompleteStore(sid,chid){if(!DATA)return false;for(var i=0;i<DATA.completions.length;i++){var c=DATA.completions[i];if(c.storeId===sid&&c.challengeId===chid)return true;}return false;}
function today(){var d=new Date();return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();}
function nowStr(){var d=new Date();var p=function(n){return n<10?'0'+n:String(n);};return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function fmtNum(n){return Math.round(n).toLocaleString('cs-CZ').replace(/,/g,' ');}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){var r='';for(var i=0;i<s.length;i++){r+=s[i]==='\n'?'<br>':s[i];}return r;}
function showMsg(id,txt,col){var el=document.getElementById(id);if(el){el.textContent=txt;el.style.color=col||'var(--up)';}}
function setSS(txt){var el=document.getElementById('syncStatus');if(el)el.textContent=txt;}
// Normalize tier names (backwards compat with old data without diacritics)
function normalizeTier(t){
  if(!t)return'Týmová';
  var map={'Tymova':'Týmová','Osobni - prodavacka':'Osobní – prodavačka','Osobni - provozni':'Osobní – provozní'};
  return map[t]||t;
}

// ── DATA ─────────────────────────────────────────────────────
function loadData(cb){
  GH.token=localStorage.getItem(GH_TOKEN_KEY)||'';GH.gistId=localStorage.getItem(GH_GIST_KEY)||'';
  if(GH.token&&GH.gistId){
    setSS('Načítání z Gistu…');
    var xhr=new XMLHttpRequest();xhr.open('GET','https://api.github.com/gists/'+GH.gistId);
    xhr.setRequestHeader('Authorization','token '+GH.token);
    xhr.onload=function(){if(xhr.status===200){try{var d=JSON.parse(xhr.responseText);var f=d.files[GIST_FILE];if(f&&f.content){DATA=JSON.parse(f.content);localStorage.setItem(DATA_KEY,f.content);setSS('✓ Synced '+nowStr());}}catch(e){loadLocal();}}else loadLocal();if(cb)cb();};
    xhr.onerror=function(){loadLocal();if(cb)cb();};xhr.send();
  }else{loadLocal();if(cb)cb();}
}
function loadLocal(){var s=localStorage.getItem(DATA_KEY);if(s){try{DATA=JSON.parse(s);setSS('Lokální data');}catch(e){}}if(!DATA)DATA={users:[],stores:[],challenges:[],progress:[],completions:[],prizes:[],season:{title:'Jaro 2026',startDate:'1. 4. 2026',active:true},sheetsUrl:''};}
function saveData(cb){
  var json=JSON.stringify(DATA,null,2);localStorage.setItem(DATA_KEY,json);
  syncToSheets();
  if(!GH.token||!GH.gistId){setSS('Uloženo lokálně');if(cb)cb(true);return;}
  setSS('Ukládání…');
  var files={};files[GIST_FILE]={content:json};
  var xhr=new XMLHttpRequest();xhr.open('PATCH','https://api.github.com/gists/'+GH.gistId);
  xhr.setRequestHeader('Authorization','token '+GH.token);xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){setSS(xhr.status===200?'✓ Synced '+nowStr():'⚠ Lokálně');if(cb)cb(xhr.status===200);};
  xhr.onerror=function(){setSS('⚠ Chyba sync');if(cb)cb(false);};
  xhr.send(JSON.stringify({files:files}));
}

// ── SHEETS SYNC (2 listy: Přehled + Log) ─────────────────────
function syncToSheets(){
  var url=DATA.sheetsUrl||localStorage.getItem(SHEETS_KEY)||'';if(!url)return;
  // Přehled rows
  var summary=[];
  for(var i=0;i<DATA.users.length;i++){
    var u=DATA.users[i];if(!u.active)continue;
    var s=getStore(u.storeId);var uPts=getUserPts(u.id);var sPts=getStoreEff(u.storeId);
    var pen=0;for(var j=0;j<DATA.completions.length;j++){var c=DATA.completions[j];if(c.userId===u.id&&c.points<0)pen+=c.points;}
    var last='';for(var k=DATA.completions.length-1;k>=0;k--){if(DATA.completions[k].userId===u.id){last=DATA.completions[k].date;break;}}
    summary.push({jmeno:u.name,email:u.email,role:u.role==='provozni'?'Provozní':'Prodavačka',prodejna:s?s.name:'',body_osobni:uPts,body_prodejna:sPts,sankce:pen,celkem:uPts+sPts,liga:getLeague(uPts).name,posledni_aktivita:last,sezona:DATA.season.title});
  }
  // Log rows — all completions with detail
  var log=[];
  for(var li=0;li<DATA.completions.length;li++){
    var comp=DATA.completions[li];
    var compUser=comp.userId?getUser(comp.userId):null;var compStore=comp.storeId?getStore(comp.storeId):null;
    log.push({datum:comp.date,cas:comp.time||'',uzivatel:compUser?compUser.name:'',email:compUser?compUser.email:'',prodejna:compStore?compStore.name:'',akce:comp.title,kategorie:comp.category||'',body:comp.points,scope:comp.scope||'',zadal:comp.addedBy||'admin'});
  }
  try{fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify({summary:summary,log:log,updated:today()})});}catch(e){}
}

// ── AUTH ─────────────────────────────────────────────────────
function doLogin(){
  var pw=document.getElementById('pwInput').value;
  var stored=localStorage.getItem(ADMIN_PW_KEY)||DEFAULT_PW;
  if(pw===stored){
    sessionStorage.setItem('ll_admin_ok','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminMain').style.display='block';
    loadData(function(){nav('overview',document.getElementById('sbn-overview'));});
  }else{document.getElementById('loginErr').textContent='Nesprávné heslo';document.getElementById('pwInput').value='';}
}
function doLogout(){sessionStorage.removeItem('ll_admin_ok');location.reload();}
function checkAuth(){if(sessionStorage.getItem('ll_admin_ok')==='1'){document.getElementById('loginScreen').style.display='none';document.getElementById('adminMain').style.display='block';loadData(function(){nav('overview',document.getElementById('sbn-overview'));});}}

// ── ROUTING ──────────────────────────────────────────────────
function nav(page,btn){PAGE=page;document.querySelectorAll('.sb-btn').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');renderPage();}
function renderPage(){if(PAGE==='overview')renderOverview();else if(PAGE==='users')renderUsers();else if(PAGE==='stores')renderStores();else if(PAGE==='addpts')renderAddPts();else if(PAGE==='log')renderLog();else if(PAGE==='challenges')renderChallenges();else if(PAGE==='prizes')renderPrizes();else if(PAGE==='backup')renderBackup();else if(PAGE==='settings')renderSettings();}

function setTarget(t){
  window._ptsTarget=t;
  document.getElementById('tgt-user-row').style.display=t==='user'?'grid':'none';
  document.getElementById('tgt-store-row').style.display=t==='store'?'grid':'none';
  document.getElementById('tgt-user-btn').className=t==='user'?'btn-p':'btn-s';
  document.getElementById('tgt-store-btn').className=t==='store'?'btn-p':'btn-s';
  document.getElementById('tgt-user-btn').style.flex='1';
  document.getElementById('tgt-store-btn').style.flex='1';
}
function onActionChange(){
  var id=document.getElementById('selAction').value;
  var at=null;for(var i=0;i<ACTION_TYPES.length;i++)if(ACTION_TYPES[i].id===id)at=ACTION_TYPES[i];
  if(!at)return;
  var qty=parseInt(document.getElementById('inpQty').value)||1;
  document.getElementById('inpPts').value=at.ptsEach*qty;
  document.getElementById('inpScope').value=at.scope;
}
function calcPts(){
  var id=document.getElementById('selAction').value;
  var at=null;for(var i=0;i<ACTION_TYPES.length;i++)if(ACTION_TYPES[i].id===id)at=ACTION_TYPES[i];
  if(!at)return;
  var qty=parseInt(document.getElementById('inpQty').value)||1;
  document.getElementById('inpPts').value=at.ptsEach*qty;
}
function submitPts(isSanction){
  var pts=parseInt(document.getElementById('inpPts').value)||0;
  var scope=document.getElementById('inpScope').value;
  var note=document.getElementById('inpNote').value.trim();
  var actionId=document.getElementById('selAction').value;
  var at=null;for(var i=0;i<ACTION_TYPES.length;i++)if(ACTION_TYPES[i].id===actionId)at=ACTION_TYPES[i];
  var title=(isSanction?'⚠️ SANKCE: ':''+(at?at.label:'Bonus'))+(note?' – '+note:'');
  if(!pts){showMsg('addPtsMsg','Zadejte počet bodů','var(--down)');return;}
  var finalPts=isSanction?-Math.abs(pts):Math.abs(pts);
  var uid=null,sid=null;
  if(window._ptsTarget==='user'){uid=document.getElementById('selUser').value;if(!uid){showMsg('addPtsMsg','Vyberte uživatele','var(--down)');return;}var u=getUser(uid);if(u)sid=u.storeId;}
  else{sid=document.getElementById('selStore').value;if(!sid){showMsg('addPtsMsg','Vyberte prodejnu','var(--down)');return;};}
  var now2=new Date();var p=function(n){return n<10?'0'+n:String(n);};
  DATA.completions.push({storeId:sid,userId:uid,challengeId:(isSanction?'pen':'pts')+'_'+Date.now(),title:title,category:at?at.cat:'vykon',points:finalPts,scope:scope,date:today(),time:p(now2.getHours())+':'+p(now2.getMinutes()),addedBy:'admin'});
  saveData(function(){showMsg('addPtsMsg','✓ Uloženo: '+finalPts+' bodů','var(--up)');document.getElementById('inpNote').value='';document.getElementById('inpQty').value=1;document.getElementById('inpPts').value=0;});
}

function exportLogCSV(){
  var rows=[['Datum','Čas','Uživatel','Email','Prodejna','Akce','Kategorie','Body','Scope','Zadal']];
  var all=DATA.completions.slice().reverse();
  for(var i=0;i<all.length;i++){var c=all[i];var cu=c.userId?getUser(c.userId):null;var cs=c.storeId?getStore(c.storeId):null;rows.push([c.date||'',c.time||'',cu?cu.name:'',cu?cu.email:'',cs?cs.name:'',c.title||'',c.category||'',c.points,c.scope||'',c.addedBy||'admin']);}
  var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var now=new Date();var p=function(n){return n<10?'0'+n:String(n);};
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='LL-log-'+now.getFullYear()+p(now.getMonth()+1)+p(now.getDate())+'.csv';a.click();URL.revokeObjectURL(url);
}
function exportCSV(){
  var rows=[['Jméno','Email','Role','Prodejna','Kategorie','Osobní body','Body prodejny HCP','Celkem','Liga']];
  var sorted=DATA.users.filter(function(u){return u.active;}).map(function(u){return{u:u,pts:getUserPts(u.id)};}).sort(function(a,b){return b.pts-a.pts;});
  for(var i=0;i<sorted.length;i++){var ru=sorted[i];var u=ru.u;var s=getStore(u.storeId);var sPts=getStoreEff(u.storeId);rows.push([u.name,u.email,u.role==='provozni'?'Provozní':'Prodavačka',s?s.name:'',s?s.category+' ×'+s.hcp.toFixed(1):'',ru.pts,sPts,ru.pts+sPts,getLeague(ru.pts).name]);}
  var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var now=new Date();var p=function(n){return n<10?'0'+n:String(n);};
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='LL-prehled-'+now.getFullYear()+p(now.getMonth()+1)+p(now.getDate())+'.csv';a.click();URL.revokeObjectURL(url);

function renderQBlock(q,i){var letters=['A','B','C','D'];var h='<div class="qblock" id="qb'+i+'"><div class="qblock-hdr"><span>Otázka '+(i+1)+'</span><button class="btn-d btn-sm" onclick="removeQBlock('+i+')">Odebrat</button></div>';h+='<input class="finput" placeholder="Text otázky" value="'+(q.q?esc(q.q):'')+'" oninput="window._qs['+i+'].q=this.value" style="margin-bottom:8px;">';h+='<div class="opts2">';for(var j=0;j<4;j++)h+='<input class="finput" placeholder="'+letters[j]+'" value="'+(q.opts[j]?esc(q.opts[j]):'')+'" oninput="window._qs['+i+'].opts['+j+']=this.value">';h+='</div><div style="font-size:10px;color:var(--muted);margin:8px 0 6px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;font-family:var(--mono);">Správná odpověď:</div><div class="correct-btns">';for(var k=0;k<4;k++)h+='<button class="cb'+(q.correct===k?' on':'')+'" onclick="setQCorrect('+i+','+k+')">'+letters[k]+'</button>';h+='</div></div>';return h;}

  h+='</tbody></table><div class="sep"></div><div class="act"><button class="btn-p" onclick="saveProgressAdmin(\''+chid+'\')">Uložit pokrok</button><button class="btn-s" onclick="closeModal()">Zavřít</button></div>';
  h+='<div class="msg" id="progMsg" style="margin-top:10px;"></div>';
  openModal('📊 '+esc(ch.title),h);
}
function saveProgressAdmin(chid){
  var ch=getCh(chid);
  for(var i=0;i<DATA.stores.length;i++){var s=DATA.stores[i];var inp=document.getElementById('pi_'+s.id);if(!inp)continue;var val=Math.max(0,Math.min(ch.target,parseInt(inp.value)||0));setProgress(s.id,chid,val);if(val>=ch.target&&!isCompleteStore(s.id,chid))DATA.completions.push({storeId:s.id,userId:null,challengeId:chid,title:ch.title,category:ch.category,points:ch.points,scope:'store',date:today(),addedBy:'admin'});}
  saveData(function(){showMsg('progMsg','✓ Uloženo','var(--up)');});
}

// ── PRIZES ───────────────────────────────────────────────────
function renderPrizes(){
  var h='<div class="ph"><div class="ph-title">Odměny</div><div class="ph-sub">Týmové a osobní odměny</div></div><div class="pb">';
  h+='<div class="sec-hdr"><div></div><button class="btn-p" onclick="openPrizeModal(null)">+ Nová odměna</button></div>';
  var tiers=['Týmová','Osobní – prodavačka','Osobní – provozní'];
  var tLabels=['🏪 Týmové','💛 Prodavačky','🏆 Provozní'];
  for(var t=0;t<tiers.length;t++){
    // Match both old and new tier names
    var tPrizes=DATA.prizes.filter(function(p){return normalizeTier(p.tier)===tiers[t];}).sort(function(a,b){return a.points-b.points;});
    h+='<div class="card"><div class="card-t">'+tLabels[t]+'</div>';
    if(!tPrizes.length){h+='<div style="color:var(--muted);font-size:13px;">Zatím žádné.</div></div>';continue;}
    h+='<table><thead><tr><th>Odměna</th><th style="text-align:right;">Body</th><th>Dostupnost</th><th></th></tr></thead><tbody>';
    for(var i=0;i<tPrizes.length;i++){var pr=tPrizes[i];
    h+='<tr><td><span style="font-size:18px;margin-right:8px;">'+esc(pr.emoji)+'</span><strong>'+esc(pr.title)+'</strong></td>';
    h+='<td style="text-align:right;font-family:var(--mono);font-weight:700;color:var(--accent);">'+fmtNum(pr.points)+'</td>';
    h+='<td style="font-size:12px;color:var(--muted);">'+esc(pr.inventory||'Dostupné')+'</td>';
    h+='<td><div class="act"><button class="btn-s btn-sm" onclick="openPrizeModal(\''+pr.id+'\')">Upravit</button><button class="btn-d btn-sm" onclick="deletePrize(\''+pr.id+'\')">✕</button></div></td></tr>';}
    h+='</tbody></table></div>';
  }
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
}
function openPrizeModal(pid){
  // Always find prize fresh from DATA
  var pr=null;if(pid){for(var i=0;i<DATA.prizes.length;i++){if(DATA.prizes[i].id===pid){pr=DATA.prizes[i];break;}}}
  var currentTier=pr?normalizeTier(pr.tier):'Týmová';
  var b='<div class="fg"><div class="frow"><label class="flabel">Emoji</label><input class="finput" id="prEmoji" maxlength="2" value="'+(pr?esc(pr.emoji):'🏆')+'"></div>';
  b+='<div class="frow"><label class="flabel">Body</label><input class="finput" id="prPts" type="number" value="'+(pr?pr.points:200)+'"></div>';
  b+='<div class="frow" style="grid-column:1/-1;"><label class="flabel">Název</label><input class="finput" id="prTitle" value="'+(pr?esc(pr.title):'')+'"></div>';
  b+='<div class="frow" style="grid-column:1/-1;"><label class="flabel">Krátký popis</label><input class="finput" id="prDesc" value="'+(pr?esc(pr.description||''):'')+'"></div>';
  b+='<div class="frow" style="grid-column:1/-1;"><label class="flabel">Pravidla (zobrazí se v detailu)</label><textarea class="ftarea" id="prRules">'+( pr?esc(pr.rules||''):'')+'</textarea></div>';
  b+='<div class="frow" style="grid-column:1/-1;"><label class="flabel">URL fotky (Unsplash nebo vlastní)</label><input class="finput" id="prImg" value="'+(pr?esc(pr.imageUrl||''):'')+'"></div>';
  b+='<div class="frow"><label class="flabel">Kategorie</label><select class="fsel" id="prTier">';
  b+='<option value="Týmová" '+(currentTier==='Týmová'?'selected':'')+'>🏪 Týmová (body prodejny)</option>';
  b+='<option value="Osobní – prodavačka" '+(currentTier==='Osobní – prodavačka'?'selected':'')+'>💛 Osobní – prodavačka</option>';
  b+='<option value="Osobní – provozní" '+(currentTier==='Osobní – provozní'?'selected':'')+'>🏆 Osobní – provozní</option>';
  b+='</select></div>';
  b+='<div class="frow"><label class="flabel">Dostupnost</label><input class="finput" id="prInv" value="'+(pr?esc(pr.inventory||'Dostupné'):'Dostupné')+'"></div></div>';
  b+='<div class="sep"></div><div class="act"><button class="btn-p" onclick="savePrize(\''+( pid||'')+'\')">Uložit</button><button class="btn-s" onclick="closeModal()">Zrušit</button></div>';
  b+='<div class="msg" id="prMsg" style="margin-top:10px;"></div>';
  openModal(pr?'Upravit odměnu':'Nová odměna',b);
}
function savePrize(pid){
  var title=document.getElementById('prTitle').value.trim();var pts=parseInt(document.getElementById('prPts').value)||200;
  if(!title){showMsg('prMsg','Zadejte název','var(--down)');return;}
  var data={id:pid||'p'+Date.now(),emoji:document.getElementById('prEmoji').value||'🏆',title:title,description:document.getElementById('prDesc').value.trim(),rules:document.getElementById('prRules').value.trim(),imageUrl:document.getElementById('prImg').value.trim(),points:pts,tier:document.getElementById('prTier').value,inventory:document.getElementById('prInv').value.trim()};
  if(pid){for(var i=0;i<DATA.prizes.length;i++){if(DATA.prizes[i].id===pid){DATA.prizes[i]=data;break;}}}
  else DATA.prizes.push(data);
  saveData(function(){closeModal();renderPrizes();});
}
function deletePrize(id){if(!confirm('Smazat?'))return;DATA.prizes=DATA.prizes.filter(function(p){return p.id!==id;});saveData(null);renderPrizes();}

// ── BACKUP ────────────────────────────────────────────────────
function renderBackup(){
  var snaps=getSnapshots();
  var h='<div class="ph"><div class="ph-title">Zálohy</div><div class="ph-sub">Export, import a snapshoty</div></div><div class="pb">';
  h+='<div class="sg">';
  h+='<div class="sc"><div class="sc-t">Záloha</div><p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;">Uloží snapshot do localStorage prohlížeče.</p>';
  h+='<div class="act"><button class="btn-p" onclick="createSnapshot(false)">📸 Záloha teď</button><button class="btn-s" onclick="exportJSON()">⬇ JSON</button></div>';
  h+='<div class="msg" id="backupMsg" style="margin-top:10px;"></div></div>';
  h+='<div class="sc"><div class="sc-t">Import</div>';
  h+='<label class="btn-s" style="display:block;text-align:center;cursor:pointer;padding:10px;">📂 Vybrat JSON <input type="file" accept=".json" style="display:none;" onchange="loadJSONFile(this)"></label>';
  h+='<textarea class="ftarea" id="importJsonArea" placeholder="nebo vlož JSON…" style="margin-top:10px;min-height:70px;font-family:var(--mono);font-size:11px;"></textarea>';
  h+='<button class="btn-p" style="width:100%;margin-top:10px;" onclick="importJSON()">✅ Importovat</button>';
  h+='<div class="msg" id="importMsg" style="margin-top:10px;"></div></div></div>';
  if(snaps.length){h+='<div class="card" style="margin-top:14px;"><div class="card-t">Uložené zálohy</div><table><thead><tr><th>Záloha</th><th style="text-align:right;">Uživatelů</th><th style="text-align:right;">Akcí</th><th></th></tr></thead><tbody>';
  for(var si=snaps.length-1;si>=Math.max(0,snaps.length-10);si--){var sn=snaps[si];h+='<tr><td style="font-family:var(--mono);font-size:12px;">'+esc(sn.label)+'</td><td style="text-align:right;font-family:var(--mono);">'+(sn.users||0)+'</td><td style="text-align:right;font-family:var(--mono);">'+(sn.completions||0)+'</td><td><button class="btn-s btn-sm" onclick="restoreSnapshot('+si+')">Obnovit</button></td></tr>';}
  h+='</tbody></table></div>';}
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
}
function getSnapshots(){try{return JSON.parse(localStorage.getItem('ll_v4_snapshots')||'[]');}catch(e){return[];}}
function saveSnapshots(arr){localStorage.setItem('ll_v4_snapshots',JSON.stringify(arr));}
function createSnapshot(silent){var now=new Date();var p=function(n){return n<10?'0'+n:String(n);};var label=p(now.getDate())+'.'+p(now.getMonth()+1)+'.'+now.getFullYear()+' '+p(now.getHours())+':'+p(now.getMinutes());var snap={label:label,data:JSON.parse(JSON.stringify(DATA)),users:DATA.users.length,completions:DATA.completions.length};var arr=getSnapshots();arr.push(snap);if(arr.length>20)arr=arr.slice(arr.length-20);saveSnapshots(arr);if(!silent){showMsg('backupMsg','✓ Záloha: '+label,'var(--up)');setTimeout(renderBackup,1500);}}
function restoreSnapshot(idx){var arr=getSnapshots();if(!arr[idx])return;if(!confirm('Obnovit zálohu z '+arr[idx].label+'?'))return;DATA=JSON.parse(JSON.stringify(arr[idx].data));saveData(null);renderBackup();}
function exportJSON(){var json=JSON.stringify(DATA,null,2);var now=new Date();var p=function(n){return n<10?'0'+n:String(n);};var blob=new Blob([json],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='LL-backup-'+now.getFullYear()+p(now.getMonth()+1)+p(now.getDate())+'-'+p(now.getHours())+p(now.getMinutes())+'.json';a.click();URL.revokeObjectURL(url);}
function loadJSONFile(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var ta=document.getElementById('importJsonArea');if(ta)ta.value=e.target.result;};reader.readAsText(file);}
function importJSON(){var raw=document.getElementById('importJsonArea').value.trim();if(!raw){showMsg('importMsg','Vložte JSON','var(--down)');return;}try{var parsed=JSON.parse(raw);if(!parsed.stores||!parsed.challenges){showMsg('importMsg','Neplatný formát','var(--down)');return;}if(!confirm('Importovat? Přepíše vše.'))return;DATA=parsed;saveData(null);showMsg('importMsg','✓ Importováno','var(--up)');setTimeout(renderBackup,800);}catch(e){showMsg('importMsg','Chyba JSON','var(--down)');}}

// ── SETTINGS ─────────────────────────────────────────────────
function renderSettings(){
  var adminPw=localStorage.getItem(ADMIN_PW_KEY)||DEFAULT_PW;var sheetsUrl=DATA.sheetsUrl||localStorage.getItem(SHEETS_KEY)||'';
  var h='<div class="ph"><div class="ph-title">Nastavení</div><div class="ph-sub">GitHub, Sheets, sezóna, přístup</div></div><div class="pb"><div class="sg">';
  h+='<div class="sc"><div class="sc-t">Sezóna</div><div class="frow" style="margin-bottom:12px;"><label class="flabel">Název</label><input class="finput" id="sTitle" value="'+esc(DATA.season.title)+'"></div><div class="act"><button class="btn-p" onclick="saveSeason()">Uložit</button><button class="btn-d" onclick="confirmReset()">🔄 Reset bodů</button></div><div class="msg" id="seasonMsg" style="margin-top:8px;"></div></div>';
  h+='<div class="sc"><div class="sc-t">Admin heslo (aktuální: <span style="font-family:var(--mono);">'+esc(adminPw)+'</span>)</div><div class="frow" style="margin-bottom:12px;"><label class="flabel">Nové heslo</label><input class="finput" id="sPw" type="password" placeholder="Nové heslo"></div><button class="btn-p" onclick="saveAdminPw()">Změnit</button><div class="msg" id="pwMsg" style="margin-top:8px;"></div></div>';
  h+='<div class="sc"><div class="sc-t">GitHub Gist</div><div class="frow" style="margin-bottom:10px;"><label class="flabel">Token</label><input class="finput" id="sToken" type="password" value="'+esc(GH.token)+'"></div><div class="frow" style="margin-bottom:12px;"><label class="flabel">Gist ID</label><input class="finput" id="sGist" value="'+esc(GH.gistId)+'"></div><button class="btn-p" onclick="saveGH()">Uložit</button><div class="msg" id="ghMsg" style="margin-top:8px;"></div></div>';
  h+='<div class="sc"><div class="sc-t">Google Sheets</div><div class="frow" style="margin-bottom:12px;"><label class="flabel">Apps Script URL</label><input class="finput" id="sSheetsUrl" value="'+esc(sheetsUrl)+'" placeholder="https://script.google.com/…"></div><div class="act"><button class="btn-p" onclick="saveSheetsUrl()">Uložit</button><button class="btn-s" onclick="syncToSheets();setSS(\'Sync odeslan\')">🔄 Sync teď</button></div><div class="msg" id="sheetsMsg" style="margin-top:8px;"></div></div>';
  h+='</div>';
  // Apps Script code
  var code='// LL Výzva v4 – Apps Script\n// Google Sheets → Rozšíření → Apps Script → vlož → Nasadit jako webovou aplikaci\n\nfunction doPost(e) {\n  try {\n    var data = JSON.parse(e.postData.contents);\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n\n    // List 1: Přehled\n    var sheet1 = ss.getSheetByName("LL-Přehled") || ss.insertSheet("LL-Přehled");\n    sheet1.clearContents();\n    sheet1.appendRow(["Jméno","Email","Role","Prodejna","Osobní body","Body prodejny","Sankce","Celkem","Liga","Poslední aktivita","Sezóna","Aktualizováno"]);\n    var summary = data.summary || [];\n    for (var i = 0; i < summary.length; i++) {\n      var r = summary[i];\n      sheet1.appendRow([r.jmeno,r.email,r.role,r.prodejna,r.body_osobni,r.body_prodejna,r.sankce,r.celkem,r.liga,r.posledni_aktivita,r.sezona,data.updated]);\n    }\n    sheet1.setFrozenRows(1);\n    sheet1.getRange(1,1,1,12).setFontWeight("bold").setBackground("#1a1a2e").setFontColor("#ffffff");\n    sheet1.autoResizeColumns(1,12);\n\n    // List 2: Log\n    var sheet2 = ss.getSheetByName("LL-Log") || ss.insertSheet("LL-Log");\n    sheet2.clearContents();\n    sheet2.appendRow(["Datum","Čas","Uživatel","Email","Prodejna","Akce","Kategorie","Body","Scope","Zadal"]);\n    var log = data.log || [];\n    for (var j = 0; j < log.length; j++) {\n      var l = log[j];\n      sheet2.appendRow([l.datum,l.cas,l.uzivatel,l.email,l.prodejna,l.akce,l.kategorie,l.body,l.scope,l.zadal]);\n    }\n    sheet2.setFrozenRows(1);\n    sheet2.getRange(1,1,1,10).setFontWeight("bold").setBackground("#1a2e1a").setFontColor("#ffffff");\n    sheet2.autoResizeColumns(1,10);\n\n  } catch(err) {}\n  return ContentService.createTextOutput("ok").setMimeType(ContentService.MimeType.TEXT);\n}\n\nfunction doGet(e) {\n  return ContentService.createTextOutput("LL Vyzva API ready").setMimeType(ContentService.MimeType.TEXT);\n}';
  h+='<div class="card" style="margin-top:14px;"><div class="card-t">Apps Script kód (2 listy: Přehled + Log)</div>';
  h+='<p style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6;">Po nasazení nové verze nezapomeň aktualizovat URL výše.</p>';
  h+='<div class="code-box">'+esc(code)+'</div>';
  h+='<button class="btn-s" style="margin-top:10px;" onclick="try{navigator.clipboard.writeText(document.querySelector(\'.code-box\').textContent);}catch(e){}setSS(\'Zkopírováno\')">📋 Kopírovat</button></div>';
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
}
function saveSeason(){DATA.season.title=document.getElementById('sTitle').value.trim();saveData(function(){showMsg('seasonMsg','✓ Uloženo','var(--up)');document.getElementById('sbSeason').textContent=DATA.season.title;});}
function confirmReset(){if(!confirm('RESET: smaže VŠECHNY body. Nevratná akce!'))return;DATA.completions=[];DATA.progress=[];saveData(null);showMsg('seasonMsg','✓ Reset','var(--up)');}
function saveAdminPw(){var v=document.getElementById('sPw').value.trim();if(!v){showMsg('pwMsg','Zadejte heslo','var(--down)');return;}localStorage.setItem(ADMIN_PW_KEY,v);document.getElementById('sPw').value='';showMsg('pwMsg','✓ Heslo změněno','var(--up)');}
function saveGH(){GH.token=document.getElementById('sToken').value.trim();GH.gistId=document.getElementById('sGist').value.trim();localStorage.setItem(GH_TOKEN_KEY,GH.token);localStorage.setItem(GH_GIST_KEY,GH.gistId);showMsg('ghMsg','✓ Uloženo','var(--up)');}
function saveSheetsUrl(){var url=document.getElementById('sSheetsUrl').value.trim();DATA.sheetsUrl=url;localStorage.setItem(SHEETS_KEY,url);saveData(null);showMsg('sheetsMsg','✓ Uloženo','var(--up)');}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalOv').classList.remove('hidden');}
function closeModal(){document.getElementById('modalOv').classList.add('hidden');}

if(!Array.prototype.filter){Array.prototype.filter=function(fn){var r=[];for(var i=0;i<this.length;i++)if(fn(this[i]))r.push(this[i]);return r;};}
if(!Array.prototype.some){Array.prototype.some=function(fn){for(var i=0;i<this.length;i++)if(fn(this[i]))return true;return false;};}
if(!Array.prototype.find){Array.prototype.find=function(fn){for(var i=0;i<this.length;i++)if(fn(this[i]))return this[i];return undefined;};}

document.getElementById('pwInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
checkAuth();
